# 市场简报：宏观与行业机会/风险（2026-08-11）

---

## 宏观机会 / 风险

### 1. 美伊僵局推升油价，通胀预期重新抬头

**判断：油价四连涨 + 美联储鹰派表态，通胀担忧从"尾部风险"升级为"近期核心变量"。**

- 布伦特原油 8/10 收涨 4.99% 至 $87.72/桶，WTI 收涨 5.05% 至 $82.13/桶，均为 8 月内新高（新华社 8/11）
- 特朗普对伊朗谈判提出大范围新要求，霍尔木兹海峡重开前景不明；美国战略石油储备降至 2.987 亿桶，创 1983 年以来最低（美国能源部 8/10）
- 克利夫兰联储主席 Hammack 8/10 公开表示"可能需要多次加息才能压降通胀至 2%"，9 月加息概率升至 51.2%（CME FedWatch 8/10）
- 10 年期美债收益率升至 4.71%（+6bp），2 年期升至 4.24%（+4bp）

> **组合含义：** 油价-通胀-加息链条重新走强，对高估值成长股（美股科技/A股光模块/半导体）形成估值压缩压力。但加息预期升温也意味着"软着陆"叙事仍然成立——联储加息是因为经济不弱，而非危机应对。
> **风险：** 周三（8/12）美国 7 月 CPI 若超预期（德意志银行预估核心 CPI 环比 +0.26%），加息概率可能跳升至 70%+，触发科技股第二轮杀估值。反之若 CPI 低于预期，通胀担忧缓解，成长股将迎修复窗口。

---

### 2. 人民币创 42 个月新高，外资回流逻辑强化

**判断：人民币升值趋势尚未结束，对 A 股尤其是外资偏好板块构成结构性支撑。**

- 在岸人民币 8/10 收报 6.7442，创 2023 年 2 月以来新高；中间价报 6.7884（中国外汇交易中心 8/10）
- 央行"十五五"规划明确提出"保持人民币汇率在合理均衡水平上基本稳定"（央行 8/10）
- 中概股隔夜逆市续涨，中概指数涨近 2%，阿里收涨约 3%（8/10）

> **组合含义：** 人民币升值 → 外资回流 A/H 股 → 利好大消费、金融、以及海外收入占比较低的科技股。但对出口导向型制造业（如部分 PCB/电子股）形成汇率逆风，需区分对待。
> **风险：** 若美元因加息预期超预期反弹（美元指数已从 99.6 反弹至 99.8），人民币短期可能回踩 6.80-6.85。日本央行 9 月加息暗示也可能扰动亚洲汇率联动。

---

### 3. A股两融余额连续回升，风险偏好修复但未过热

**判断：杠杆资金从"恐慌撤离"转向"选择性回补"，但追高意愿在 4000 点附近明显减弱。**

- 8/10 两市融资余额 26,366 亿元（+140.72 亿），融资融券余额 26,621 亿元（+146.15 亿），连续多日净流入（证券时报 8/11）
- 融资买入集中半导体、元件、通信设备；银行、白酒、石油遭净卖出（浙商证券两融 8/11）
- 8/11 沪深成交额 23,209 亿元，较前日缩量 2,021 亿元，缩量幅度约 8%（中新经纬 8/11）
- 全市场 1,615 只上涨 / 3,777 只下跌，结构分化明显

> **组合含义：** 两融回升 + 缩量 = 不是全面牛市，而是结构性行情。资金从前期涨幅大的资源股撤出，转向科技（电子/通信净流入 65亿+/57亿+）和医药（102亿+净流入）。这意味着"高仓位+高轮动"环境下，选赛道比选时点更重要。
> **风险：** 两融余额距 7 月中旬峰值（约 4,100 亿元）仍低约 35%，市场尚未过热。但若成交额持续萎缩至 2 万亿以下，可能触发杠杆资金的连锁平仓。

---

## 行业机会 / 风险

### 4. Nvidia 联手华尔街 $5,000 亿算力融资平台：AI 基建逻辑质变

**判断：这是本周最重要的行业催化剂——GPU 从"折旧品"被重新定义为"可投资资产类别"，AI 基建融资瓶颈有望突破。**

- Nvidia 8/10 宣布与 Apollo、BlackRock、Blackstone、Brookfield、Goldman Sachs、KKR 签署 MOU，设立独立算力融资平台，目标调动超 $5,000 亿第三方资本（Nvidia 官方公告 8/10）
- 黄仁勋："这是技术芯片首次成为一种具备投资价值的资产类别"，资本方获得与算力使用情况挂钩的长期收益（CNBC 采访 8/10）
- 贝莱德 CEO 芬克将其类比 1970 年代 MBS 诞生——"金融工程未来新篇章"（澎湃新闻 8/11）
- 2026 年全球科技巨头 AI 资本开支合计预计超 $7,300 亿（Reuters 8/11）

> **组合含义：** 这个事件对 AI 基建全产业链是结构性利好——光模块（数据中心互联需求）、半导体设备（扩产加速）、存储（HBM/DRAM 需求）、neocloud（算力租赁商业模式获得资本背书），全部受益。$5,000 亿不是一次性投放，但示范效应可能降低整个 AI 产业链的融资成本。A 股映射最直接的是光模块（中际旭创/新易盛/天孚通信）、算力租赁（奥飞数据）和半导体设备（北方华创/中微公司，但你的持仓通过 ETF 间接持有）。
> **风险：** MOU 尚未转为正式协议，实际部署进度不确定；$5,000 亿是长期上限，不会改变短期供需。若资本过热导致盲目建设，2-3 年后可能出现算力过剩。短期 Nvidia 股价在消息后跌近 3%，说明市场已部分 price-in。

---

### 5. 光模块 FCC 限制落地温和，"易中天"深V反弹

**判断：政策风险"由暗转明"且方向比预期温和，光模块板块进入情绪修复窗口。**

- 网传 FCC 限制从"大范围限制"调整为"小幅收紧准入认证"，海外大厂联合反对进一步强化温和判断（中新经纬 8/11）
- 8/11 盘中中际旭创从跌超 2% 直线拉升收涨 5.44% 至 ¥886.96，新易盛涨 3.93%，天孚通信翻红；光模块板块主力净流出仅 ¥11.7 亿，较前期显著收窄（盘中数据 8/11）
- 中际旭创 H 股获摩根大通（持股 13.48%→15.02%）/高盛（11.65%→12.19%）/中金密集增持；韩国投资者近一月净买入 3.4 亿港元，居韩国投资者净买入港股榜首（港交所披露 8/5-8/10）
- 光模块龙头 1.6T 产品持续放量，订单排期至 2028 年（业内信息 8/11）

> **组合含义：** 你的光模块持仓（中际旭创占 A 股市值 ~17%，通信 ETF 占 ~7%）是当前受益最直接的赛道。FCC 风险出清 + Nvidia $5000 亿融资 = 双重催化剂。中际旭创 H 股获顶级机构密集增持，是强信心信号。但需注意：板块今日深 V 反弹后，追高风险上升。
> **风险：** "温和"不等于"解除"——FCC 最终条款细节未公布，政策仍有变数。1.6T 产品若量产进度不及预期，当前高估值缺乏安全边际。Coherent（光通信美股龙头）隔夜跌超 10%，海外光通信情绪仍脆弱。

### 6. 存储"超级周期"验证，供需缺口至少延续至 2027

## 宏观机会 / 风险

### 1. 美国劳动力市场显著降温，降息预期重燃

**判断：ADP就业数据远逊预期，叠加ISM服务业略低于预期，"滞胀"隐忧重新浮出水面，Fed加息路径面临重新定价。**

- 美国7月ADP新增就业仅4.4万人，远低于市场预期的7.5万人，创年内最低（来源：ADP，2026-08-05）
- ISM服务业PMI 7月报54.1，略低于预期54.5，仍在扩张但动能减弱，其中价格支付分项上升引发滞胀担忧（来源：ISM，2026-08-05）
- Fed理事Cook明确表态"通胀若未见降温已准备好加息"；今年票委Kashkari呼吁"现在加息，别等通胀失控再猛踩刹车"，暗示年内三次加息并非不可能（来源：华尔街见闻，2026-08-06）
- CME FedWatch：9月16日会议加息25bp概率降至55%（一周前曾达63%），市场对ADP疲软做出鸽派反应（来源：CME，2026-08-06）

| 指标 | 8/5收盘 | 变动 |
|------|---------|------|
| 10Y美债收益率 | 4.615% | +0.21bp |
| 2Y美债收益率 | 4.177% | -1.05bp |
| 美元指数 | 99.68 | -0.17% |
| 现货黄金 | $4,308-$4,331 | +3.74% |

> **组合含义：** 劳动力市场走软暂时压制了加息预期，但Cook/Kashkari的鹰派立场说明Fed内部分歧加剧。利率路径不确定性上升——软数据（ADP）偏鸽，硬数据（ISM价格）偏鹰。对科技股估值而言，利率预期下行是短期利好，但滞胀叙事若确立，将冲击成长股长期DCF模型。
> **风险：** 周五非农（8/7）是决定性验证节点——若非农同样大幅低于预期（<10万），可能触发"坏消息即好消息"的短暂反弹后，市场重新定价衰退风险。若非农强劲（>20万），加息预期将迅速回升。

### 2. 美伊霍尔木兹谈判推进，油价承压但地缘溢价尚未完全消退

**判断：伊朗-阿曼协议谈判取得实质进展，布伦特跌至$79区间，但霍尔木兹通行量仍仅约正常的5%，航运恢复正常尚需时日。**

- 伊朗与阿曼达成协议方案，同意在伊朗控制霍尔木兹通行条件下部分重开海峡，美国国务卿鲁比奥表示谈判"已取得进展"但协议尚未最终敲定（来源：Reuters，2026-08-05）
- 布伦特原油8/6报$79.08/桶（-0.5%），WTI报$74.69/桶（-0.7%）；两日累计跌幅超10%，为7月10日以来最低（来源：ICE/NYMEX，2026-08-06）
- 胡塞武装8/5声称对红海延布港附近的沙特油轮发动导弹袭击，沙特未确认（来源：Reuters，2026-08-05）
- Goldman Sachs基准情景：布伦特Q4均价$80，2027年回落至$75；若霍尔木兹持续封锁，极端情景$120（来源：Goldman Sachs，2026-08-06）
- 现货黄金突破$4,300，8/5单日涨4.11%创1月28日以来最大涨幅，8/6继续上行至$4,327（来源：COMEX，2026-08-06）

> **组合含义：** 油价大幅回落缓解了成本端通胀压力，对中下游制造业（PCB、电子材料）构成结构性利好。黄金暴涨反映的是衰退对冲需求（ADP走弱）+ 地缘不确定性溢价 + 美元走弱三重叠加。霍尔木兹若完全重开，油价有望进一步跌至$70-75区间，但航运保险费用恢复正常前，不排除反复。
> **风险：** 伊朗发出警告——若美军再次打击伊朗领土，将报复海湾国家能源基础设施。胡塞红海袭击持续，航运全面恢复的时间表高度不确定。

### 3. 中美科技博弈再升级：光模块禁令传闻 + 无人机出口管制

**判断：FCC光模块禁令仍处于传闻阶段（企业已辟谣），但无人机管制落地标志中美科技脱钩进入"双向制裁"新阶段，短期冲击情绪但不改变光通信产业基本面。**

- 8/5路透社报道FCC正在起草禁令，拟禁止进口中国新型号数据中心光收发模块（800G/1.6T），随后中际旭创、新易盛、天孚通信集体回应"经核实FCC尚未出台相关限制性文件"（来源：财联社/每日经济新闻，2026-08-05）
- "易中天"三巨头8/5盘中一度跌超10-14%，尾盘大幅收窄（中际旭创-7.27%/新易盛-5.29%/天孚通信+2.29%），当日成交合计超1,200亿元创历史天量（来源：同花顺，2026-08-05）
- 8/5商务部公告：加强无人机相关两用物项对美出口管制，逐案从严审核；将6家美国实体列入反制清单；警告若美方继续出台新限制将"进一步反制"（来源：央视新闻，2026-08-05）
- 特朗普政府据报准备对多晶硅征收新关税并考虑限制中国光收发器（来源：Kapitales，2026-08-06）

> **组合含义：** 光模块禁令目前仅为草案/传闻阶段，且落地难度极高——中国厂商占全球800G+光模块约70%份额，若美国强制"一刀切"将严重冲击自身AI基建进度。短期情绪冲击已充分释放（三巨头巨量换手），资金面反而转为净流入（天孚连续5日累计流入¥61.7亿）。应区分"可落地制裁"（无人机管制）与"不可落地威胁"（光模块禁令）。
> **风险：** 若FCC禁令正式进入立法程序（而非传闻阶段），即使最终不通过，过程本身也将反复扰动光通信板块估值。关税若扩展至光收发器将构成实质性利空。

## 行业机会 / 风险

### 4. 光通信：CPO量产里程碑确认，但A股映射端遭遇"脱钩折价"

**判断：英伟达CPO量产宣言是产业级里程碑，验证层坚实，但A股光模块正处于"产业逻辑vs地缘恐慌"的剧烈博弈阶段，短期波动率极高。**

- 英伟达资深副总裁Gilad Shainer 8/4正式宣布CPO技术进入量产阶段，已向紧密合作客户交付交换机产品，预计未来一年大量CPO交换机将在全球AI工厂落地；Scale-up所需带宽将是Scale-out的十倍以上（来源：PANews/新浪财经，2026-08-04）
- 中际旭创8/6收盘¥955（+0.77%），盘中冲高至¥995后回落，成交398亿；8/5曾创675亿单日历史天量，当日大宗交易¥961.04（溢价0.63%），8/4-8/5融资净买入¥10.55亿（来源：深交所，2026-08-05）
- 天孚通信8/6收盘¥225.28（+3.89%），连续5日主力净流入¥61.71亿，成交147亿；8/5融资买入¥13.01亿，余额¥66.55亿（来源：证券时报/数据宝，2026-08-06）
- LightCounting统计：2025年全球前十大光模块厂商中中国企业占七席，中际旭创+新易盛合计约占全球光收发市场50%份额（来源：LightCounting，2026-08-06）

> **组合含义：** CPO量产是验证层里程碑——1.6T/CPO的需求真实性已获英伟达背书。但A股映射端因FCC传闻产生"产业逻辑确认+地缘风险折价"的矛盾定价。关键变量：①8/12 NBIS财报验证neocloud需求；②FCC禁令是否进入正式程序；③9月英伟达GTC可能披露CPO交换机订单数据。
> **风险：** 若FCC禁令传闻反复升级，"脱钩折价"可能从短期情绪事件演变为中期估值压制。中际旭创当前PE(FY1)已回落至历史中值以下，但若关税落地将冲击盈利模型。

### 5. 存储：DRAM涨价持续但动能收敛，三星夺回王座，长鑫打入PC供应链

**判断：存储处于"高景气+高位收敛"第二阶段——涨价仍在继续但速率放缓，竞争格局从SK一家独大变为三星/美光追赶，中国长鑫供应链突破是新增变量。**

- 3Q26 DRAM合约价预测环比+13%-18%，较2Q26的+58%-63%显著收敛；NAND合约价预测环比+10%-15%（来源：TrendForce，2026-08）
- Q2 DRAM市场份额：三星39%（重返第一）、SK海力士26%（从39%下降）、美光25%紧追第二，长鑫科技同比+716%为全球增长最快（来源：Counterpoint Research，2026-08-04）
- DRAM 6月大宗价格连续第6个月上涨，16Gb DDR5以约$38.3成交；三大原厂将约50% DRAM总产量供应超大规模云服务商，通用产品持续供不应求（来源：日经中文网，2026-08-06）
- 长鑫存储打入PC供应链——惠普、华硕、宏碁开始采用少量长鑫芯片；同时拒绝苹果压价，"要求报价不低于三星/SK海力士"（来源：日经亚洲/经济日报，2026-08-04/06）
- SK海力士DRAM毛利率预计Q2达90.9%，接近周期峰值；美光DRAM单价环比涨超60%；BOCOM将SK海力士目标价上调至₩350万（约$2,450）（来源：Bernstein/BOCOM，2026-08）

> **组合含义：** 存储板块基本面依然强劲（需求>供给至少持续至2027年），但价格涨幅收敛+边际竞争加剧意味着"躺赢"阶段已过。三星夺回份额对SK海力士形成短期压力（HBM均价下跌冲击），但三大厂LTA锁定60-70%产能构成中期安全垫。A股映射：长鑫科技(688825)作为国内DRAM唯一标的，PC供应链突破是重要验证，但估值已反映部分预期。
> **风险：** 存储毛利率接近历史峰值（88-92%），投资者需关注高利润率可持续性及中国竞争对手的追赶速度。HBM4延迟发布带来的HBM3E降价压力可能在Q3持续。

### 6. Neocloud：NBIS Q2财报今日盘前公布，CoreWeave亚太扩张验证全球化趋势

**判断：Neocloud赛道仍处于"验证层"而非"预期层"，NBIS今日Q2财报是近期最重要的个股催化剂，CoreWeave进军印尼验证AI算力全球化需求。**

- NBIS预计8/6盘前发布Q2财报：市场共识EPS -$0.73，营收$576.67M（vs Q1的$399M）；中金5月上调目标价至$275（150%涨幅），维持跑赢行业（来源：Benzinga/中金，2026-08-06）
- NBIS Q1营收$399M（同增622%），GAAP净利润$6.21亿（ClickHouse股权重估带来的非现金收益），锁定超3.5GW电力，现金超$90亿（来源：中金研报，2026-08）
- CoreWeave 8/4宣布进军印尼，建设3座合计360MW数据中心（2028年投运），为该公司亚太地区首个布局；此前已入选Nasdaq-100指数，与Jane Street签署$60亿AI云协议（来源：CoreWeave/IT之家，2026-08-05）
- IREN 2026年ARR目标上调至>$40亿（85%已签约），Hut 8签署$98亿15年租赁协议；Gartner预测neocloud到2030年将占AI云市场20%份额（$534亿）（来源：Gartner，2026-08）

> **组合含义：** NBIS Q2财报将是验证"从容量签约到收入兑现"转化效率的关键——市场关注的核心指标是营收是否超$600M及GPU利用率指引。若超预期，NBIS有望挑战$220-240区间（接近中金目标$275的80%）；若不及预期，空头（30.22%）可能进一步打压。对长青持仓中的NBIS（大小号合计95股），今日盘前财报将直接决定短期方向。
> **风险：** NBIS空头占比30.22%+IV 155%（7月底数据），财报后可能出现双向剧烈波动。若营收低于$500M或GPU利用率指引不及预期，股价可能回测$150-170区间。

### 7. A股风格轮动：资源股暴涨 vs 科技股震荡整理

**判断：连续两日科技暴力反弹后，8/6市场进入"煤飞色舞"的资源股主导模式，科技股内部从"普涨"切换为"分化"，主线从全面反攻转为结构性机会。**

- 上证+0.57%收3900，科创50+0.45%，创业板-0.55%，深证-0.24%，成交缩量至¥2.53万亿（-1308亿），2785涨/2585跌（来源：中国经济网，2026-08-06）
- 煤炭板块近10只涨停（昊华能源、潞安环能、淮北矿业等），动力煤5500大卡报¥839/吨涨¥5；长江证券预计2026年动力煤有效供应同比减少1.9%（来源：澎湃新闻，2026-08-06）
- 电子化学品/工业气体延续活跃，中巨芯盘中20%涨停，半导体材料方向资金持续流入；PCB板块净流入¥61.58亿排名第一（来源：中国经济网，2026-08-06）
- 两融余额8/5科创板3511亿（+57亿），8/4两市26152亿（+127亿），通信行业融资净买入¥32.72亿居首（来源：证券时报/上证报，2026-08-05/06）
- 云南锗业(002428)涨停(+10%)收¥90.98，中钨高新(000657)+8.83%，资源+半导体材料双属性标的受追捧（来源：同花顺，2026-08-06）

> **组合含义：** 科技股从8/4-8/5的普涨（创业板+5.64%/+1.32%）转入分化整理阶段属正常——连续暴涨后需要筹码换手。但关键信号是：资金并未撤离科技，而是从高位存储（长鑫科技-4.31%）切换至PCB/半导体材料/设备方向。中信建投策略框架下，这是"反弹第二阶段"的典型特征——资金找"有业绩支撑+相对滞涨"的品种。
> **风险：** 若成交量继续萎缩至¥2.3万亿以下，指数可能回踩。资源股暴涨若缺乏持续性（动力煤价受政策压制），资金可能快速回流科技，届时追高资源股的资金将被套。

### 8. 港股：跟随美股科技回调，科网/半导体领跌，煤炭黄金逆势

**判断：港股8/6跟随隔夜美股科技股回调（纳指-0.83%），恒科-2.28%领跌，但煤炭和黄金股逆势走强，反映全球"Risk-Off"情绪向亚太传导。**

- 恒指-1.49%收25530，恒科-2.28%收4821（盘中跌超2.4%），国企指数-1.22%，成交额偏低（来源：港交所，2026-08-06）
- MiniMax大涨超17%，智谱涨超4%；中芯国际、华虹宏力下挫；科网普跌（百度、阿里、快手、小米领跌）（来源：中新经纬，2026-08-06）
- 煤炭股逆势——蒙古能源+6.48%、兖矿能源+6.12%；黄金股走强——潼关黄金+8.58%、灵宝黄金+4.82%（来源：财联社，2026-08-06）
- 宁德时代港股跌超5%——里昂指出Q2毛利率逊于预期，钠离子电池量产增加下半年利润率不确定性（来源：里昂证券，2026-08-06）

> **组合含义：** 港股科技回调更多是跟随美股而非内生恶化——恒指今年以来整体偏弱，但腾讯、网易等此前已有企稳迹象。对长青持仓中的长飞光纤光缆(06869)，港股科技情绪走弱可能继续压制估值，但光纤光缆更多跟随A股通信板块走势。
> **风险：** 若恒科跌破4700点，可能触发新一轮技术性抛压。宁德时代持续走弱若扩散至整个新能源板块，将拖累恒指整体表现。

### 6. neocloud与AI基建：Citadel清场后重建，验证节点密集来临

**判断：neocloud赛道7月经历了"英伟达循环融资恐慌→Situational基金崩盘→Citadel接盘"三重暴击，目前处于情绪底部+估值修复窗口，8/6 NBIS财报是第一块试金石。**

### 7. 光通信与PCB/玻纤：A股端持续失血，中国巨石跌停

**判断：光通信和PCB/材料仍是A股科技板块中"流动性出清"最严重的两个子赛道——订单端未恶化但股价已回到数月前水平，板块处于极端超卖状态。**

- 8月3日，中国巨石（600176）跌停（-9.99%）至¥34.06，生益科技（600183）-3.42%至¥102.03，半导体设备ETF（159516）-9.70%至¥0.605，科创半导体设备ETF（588710）-9.93%至¥2.567（westock-data，2026-08-03）

- PCB上游：建滔积层板已在7/28-7/30清仓（实现亏损-HK$17.3万，PORTFOLIO 8/3更新），中国巨石跌停意味着玻纤/电子布板块全面陷入流动性危机
- 但基本面层面：建滔年内第六轮提价（FR-4累计+55%），电子布供给缺口已持续近一年（21世纪经济报道，2026-07-27）

> **组合含义：** PCB/玻纤板块正在经历"基本面强 + 流动性杀"的第二阶段——涨价逻辑成立但资金不断流出。中国巨石跌停、生益科技继续跌，本质上是被科技股去杠杆的洪流裹挟。单独看巨石，跌停价¥34.06已接近ma20附近的支撑位。光通信端中际旭创相对抗跌（仅+0.05%），说明1.6T量产逻辑仍被部分资金认可。当前阶段关键是区分"基本面没变但被流动性格杀的"和"基本面已恶化的"——前者的持仓逻辑仍然成立。
> **风险：** 若融资余额继续以每周¥700亿+速度减少，即使基本面没问题，也会面临被迫平仓带来的价格冲击。中国巨石若再跌停破¥30，可能触发更多两融强平。

**判断：美联储内部分歧已从"暗流"升级为"明面对抗"，9月加息25bp被市场完全定价，沃什的"模糊沟通"策略正在失去对鹰派的约束力。**

- 7月29日（美东时间）FOMC以9:3投票维持联邦基金利率3.50%-3.75%不变，连续第5次按兵不动，符合市场预期（界面新闻/新华社，7/30）
- 三位地区联储主席投下反对票主张加息25bp，为2016年以来首次三张立场一致的反对票（华尔街见闻，7/30）
- CME FedWatch决议后：9月维持不变概率36.8%，加息25bp概率63.2%；12月至少两次加息概率约58%（证券数据宝，7/30）
- 华泰证券将加息预测从"2027年上半年两次"提前至"今年下半年1-2次"（21世纪经济报道，7/30）
- 花旗仍坚持今年晚些时候降息，预计10月/12月/1月各降一次（21世纪经济报道，7/30）
- 沃什称"通胀不可能九周内解决"，声明仅115词创近20年最短，不做预测（界面新闻，7/30）

> **组合含义：** 利率路径不确定性从"是否加息"切换至"何时加息"。9月加息概率63.2%意味着市场已提前定价，若后续通胀数据超预期，加息预期可能进一步升温，对长久期高估值品种（AI硬件、neocloud）构成折现率上行压力。花旗的降息判断属条件情景，不是基线判断。

> **风险：** 若8月CPI再度超预期，9月加息概率可能升至80%+，触发全球成长股二次抛售。沃什"不做预测"的沟通风格使前瞻指引真空，市场只能靠数据点逐次博弈。

### 3. 微软盘后大涨9% vs Meta暴跌10%+：AI资本开支"分化时刻"——微软下调capex，Meta FCF崩塌91%

**判断：大型科技公司的AI资本开支叙事从"一致上修"切向"分化验证"，微软以capex下调+Azure超预期+FCF维持正值为"良性投入"正名，Meta以FCF暴跌91%+Q3指引低于预期为"烧钱无底洞"提供反面案例。**

- 微软Q4 FY2026：营收$900.1亿（超预期$876.2亿，+18% YoY），EPS $4.74；Azure Q4增长31.6%超预期，FY27 Q1指引增长45%（CNBC，7/30）
- 微软FY27 capex指引$1750亿，较此前市场预期$1900亿下调；数据中心折旧年限从15年延长至25年，释放利润空间（CNBC，7/30）

- Meta Q2：营收$608亿（+28% YoY，超预期），但净利润$158.5亿（-14% YoY），运营利润率从43%降至31%（腾讯财经/中新经纬，7/30）
- Meta Q2 FCF仅$7.84亿（去年同期$85.5亿，-91%），创2022年Q3以来近四年最低；capex $310.8亿（+83% YoY）（智通财经，7/30）
- Meta全年capex指引从$1250-1450亿上调至$1300-1450亿；Q3营收指引中值$625亿低于预期$632亿；盘后跌超10%（腾讯财经，7/30）
- 高通Q3营收下降4%，预计全年手机业务降20%，苹果业务流失快于预期；盘后跌4.68%（21世纪经济报道，7/30）

> **组合含义：** AI资本开支进入"验证分化期"。微软证明"大额投入可转化为云收入增长+FCF可控"，Meta则暴露"烧钱不等于变现"的风险。市场将重新定价AI基建链条：有收入兑现路径的标的（Azure生态、有合同锁定的neocloud）获得溢价，纯烧钱标的面临估值压缩。微软capex下调可能被市场解读为"AI基建投资峰值已过"的信号，对半导体设备/存储/光模块需求预期构成边际利空。

> **风险：** 微软capex下调若引发其他hyperscaler跟进，全球AI硬件需求增速预期可能下修，直接冲击存储/光模块/半导体设备的需求定价。

    var esc = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var lines = esc.split('\n');
    var out = '';
    var inUL = false, inOL = false, inBQ = false, inTable = false, tableRows = [];

      t = t.replace(/&lt;span\s+style="color:red"&gt;/g, '<span class="up">')
           .replace(/&lt;span\s+style="color:green"&gt;/g, '<span class="down">')
           .replace(/&lt;\/span&gt;/g, '</span>');

      return t;

    function closeBQ(){ if(inBQ){out+='</blockquote>';inBQ=false;} }

    function flushTable(){
      if(!inTable || tableRows.length === 0) return;
      out += '<table><thead><tr>';
      tableHeaders.forEach(function(h){
        out += '<th>' + inline(h) + '</th>';
      });
      out += '</tr></thead><tbody>';
      tableRows.forEach(function(row){
        out += '<tr>';
        row.forEach(function(cell){
          out += '<td>' + inline(cell) + '</td>';
        });
        out += '</tr>';
      });
      out += '</tbody></table>';
      inTable = false;
      tableRows = [];
      tableHeaders = [];
    }

    function parseTableRow(line){
      // Remove leading/trailing pipes
      var trimmed = line.trim();
      if(trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
      if(trimmed.charAt(trimmed.length-1) === '|') trimmed = trimmed.slice(0,-1);
      return trimmed.split('|').map(function(c){ return c.trim(); });
    }

    function isSeparator(line){
      return /^\|?[\s-:|]+\|?$/.test(line.trim()) && line.indexOf('-') >= 0;
    }

    for(var i=0;i<lines.length;i++){
      var line = lines[i];

      // Table detection
      if(line.indexOf('|') >= 0 && line.trim().charAt(0) !== '-'){
        var cells = parseTableRow(line);

        // Check if next line is a separator
        if(!inTable && i+1 < lines.length && isSeparator(lines[i+1])){

          tableHeaders = cells;

      else { closeList();closeBQ(); out+='<p>'+inline(line)+'</p>'; }
    }
    closeList();closeBQ();flushTable();
    return out;
  }

  function renderReport(d){
    var mdEl = document.getElementById('md-' + d);
    if(!mdEl){ reportEl.innerHTML = '<div class="loading">报告不存在</div>'; return; }

    reportEl.classList.remove('show');

    setTimeout(function(){
      var md = mdEl.textContent.trim();
      var html = parseMarkdown(md);

      // Split into sections by ## headers for card layout
      var sections = splitSections(html);

      reportEl.innerHTML = sections.map(function(s){
        return '<div class="md-card"><div class="md">' + s + '</div></div>';
      }).join('');

      // Trigger animation - clear inline opacity first to let CSS class take effect
      reportEl.style.opacity = '';
      requestAnimationFrame(function(){
        reportEl.classList.add('show');
      });
    }, 200);
  }

  function splitSections(html){
    var parts = [];
    var h1Match = html.match(/<h1[^>]*>[\s\S]*?<\/h1>/);
    var h2Regex = /<h2[^>]*>[\s\S]*?(?=<h2|$)/g;
    var h2Matches = html.match(h2Regex) || [];

    if(h1Match){
      var afterH1 = html.slice(h1Match.index + h1Match[0].length);
      var firstH2 = afterH1.indexOf('<h2');
      var intro = firstH2 >= 0 ? afterH1.slice(0, firstH2) : afterH1;
      parts.push(h1Match[0] + intro);
    }

    h2Matches.forEach(function(m){ parts.push(m); });

    return parts.length ? parts : [html];
  }

  // Initial render
  renderReport(current);
})();
</script>
