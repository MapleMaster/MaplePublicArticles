# 市场简报：宏观与行业机会/风险（2026-08-15 周六）

> 数据覆盖：美股（8/14 周五收盘）＋ A股/港股（8/14 收盘，最近交易日）＋ 周末宏观与下周（8/17）展望

---

## 宏观机会 / 风险

### 1. 9 月加息预期崩塌：零售销售 -0.6% 创逾一年最大降幅，FedWatch 加息概率降至约 1/3
**判断：非农转负 → CPI/PPI 降温 → 零售销售负增长，三连击已把"9 月加息"从基线情景降级为条件情景，但长端利率仍在为财政赤字与油价定价，"股市欢呼 vs 债市警告"两套逻辑并行。**

- 美国 7 月零售销售环比 <span style="color:green">-0.6%</span>（去年 5 月以来最大降幅，预期 +0.1%），核心零售环比 -0.4%；8 月密歇根消费者信心初值 51（前值 55.2，三个月来首次回落），一年通胀预期升至 4.3%（来源：美国商务部/密歇根大学，2026-08-14）
- CME FedWatch：9 月维持利率不变概率 67.5%，加息 25bp 概率 32.5%（7 月下旬曾高达 75%）（来源：CME FedWatch，2026-08-15）
- 但长端反向：10Y 美债 <span style="color:red">+5.1bp</span> 报 4.690%，30Y <span style="color:red">+4.1bp</span> 报 5.258%（此前 30Y 标售收益率创 25 年新高）；美元指数 -0.32% 报 99.64（来源：Wind/新浪财经，2026-08-14）
- 美股 8/14：道指 <span style="color:green">-0.20%</span> 报 53,732.41、标普 500 <span style="color:green">-0.17%</span> 报 7,785.76、纳指 <span style="color:green">-0.28%</span> 报 26,729.16；周线标普 <span style="color:red">+0.36%</span>、纳指 +0.14%；罗素 2000 <span style="color:red">+0.51%</span> 创收盘纪录，四连涨（来源：新华社/财联社，2026-08-15）

> **组合含义：** 加息预期退潮是成长股（AI 硬件/半导体/存储）估值修复的顺风，A股映射端 8/17 高开概率提升；但零售转负意味着市场叙事将逐渐从"利率利好"切换到"增长放缓对盈利的传导"，高估值科技仓位的盈利兑现要求同步提高。
> **风险：** 核心 PCE 仍粘在 3.3% 附近，鹰派官员（哈马克、毕马威 Swonk）明确表示温和 CPI 并未排除加息；若 8 月下旬数据重新走强（油价推高 PPI 传导），加息概率会快速回摆。

### 2. 油价周涨 6.31% 重返 $88：霍尔木兹通航量仅剩战前约 6%，特朗普扬言"美国领土"
**判断：地缘溢价重新主导油价，霍尔木兹从"表态升级"走向"物理约束"——通航量数据证实航运中断是真实发生的，油价重回 $88 对"通胀降温"叙事构成实质性挑战。**

- 8/14 布油 <span style="color:red">+1.67%</span> 报 $88.52（周涨 6.31%），WTI +1.42% 报 $82.40（周涨 5.40%）（来源：财联社，2026-08-15）
- Kpler 数据：8/13 霍尔木兹仅 9 艘商品船通过（战前日均 125-140 艘，8 月至今日均约 12 艘），大多数船改走伊朗一侧航线（来源：Kpler/Reuters，2026-08-14）
- 特朗普 8/14 声称"击败伊朗后很快将宣布霍尔木兹海峡为美国领土"，美国财政部长贝森特称将对伊朗实施"前所未见"的经济孤立措施（来源：央视新闻/格隆汇，2026-08-15）
- 亚洲炼厂加速转向：韩国 GS Caltex 采购约 200 万桶 Mars 原油，美国对亚洲原油出口 7 月达创纪录 235 万桶/日（来源：Reuters，2026-08-14）

> **组合含义：** 油价上行 → 通胀预期回摆 → 利率路径重定价，是当前成长股估值假设的最大外部变量；对组合的含义是"有色/黄金对冲仓位"的配置价值上升（现货黄金 8/14 报 $4,376.59），而非直接能源敞口。
> **风险：** 若霍尔木兹实际通行量进一步归零（目前是"极低但未中断"），布油突破 $95-100 将推翻 9 月不加息叙事；高盛式极端情景（扰动持续至四季度油价 $120）不是基线判断，但油价每涨 $10 对通胀预期的影响约 +0.2-0.3pct。

### 3. 日本央行最早 9 月加息：美日政策分化进入"交叉验证"窗口
**判断：Fed 暂停加息预期升温的同时，日本央行转鹰概率升至约 80%——若 9 月双双落地，美日利差收窄将引发全球套息交易持续去杠杆，这是当前被 A股投资者低估的流动性风险。**

- Reuters 8/14 援引知情人士：日本央行考虑 9/17-18 会议加息 25bp（当前利率 1%），并可能在 12 月或明年初再次行动；市场对 9 月加息定价已升至约 80%（来源：Reuters，2026-08-14）
- 推手：7 月企业物价同比仍高达 7.2%、弱日元抬高进口成本、AI/半导体投资推升企业需求与工资压力（来源：Reuters，2026-08-14）
- 美元兑日元 -0.12% 报 159.33（来源：Wind，2026-08-14）

> **组合含义：** 日央行加息 → 日元走强 → 套息交易平仓 → 全球高贝塔资产（科技/成长）波动放大，历史上 7 月底日韩股市熔断即是此链条的极端案例；对组合的含义是"高波动资产（NBIS、TQQQ、科创芯片）的仓位波动容忍度需要预留缓冲"。
> **风险：** 若 BOJ 按兵不动（中东油价推升日本进口通胀 vs 全球需求放缓，政策路径存在两面性），套息交易去杠杆将暂缓；但 9 月是美日央行"双会"窗口，8 月下旬的定价波动会加剧。

### 4. 存储超级周期获"管理层级"背书：SK海力士警告明年或现史上最严重内存短缺
**判断：从合约价、远期利润模型（闪迪投资者日）到管理层公开喊话（SK海力士董事长），存储景气度验证层层递进——"2027 年产能售罄"叙事已升级为"明年史上最严重短缺"的供给端警告，存储是当前跨市场共振最连续的主线。**

- SK海力士董事长崔泰源 8/14：AI 服务器需求爆发下 HBM 供不应求，科技巨头提前抢签长协；警告"明年可能出现有史以来最严重的内存短缺"，预测 AI 智能体使用量五年内增长 77 倍（来源：财联社/韩联社，2026-08-14）
- 美股 8/14 存储股：闪迪 <span style="color:red">+7.39%</span>（周涨 35.38%）、希捷 +5.65%、西部数据 +4.41%、美光 +2.3%、SK海力士 ADR +0.40%（来源：财联社/新浪财经，2026-08-15）
- 韩国 7 月 ICT 出口 $533.6 亿（<span style="color:red">+140.6%</span>，历年同月最高），占整体出口 54%；三星 8/14 <span style="color:red">+2.43%</span>（周涨 18.83%），SK海力士周涨 15.68%，KOSPI 周涨 11.49% 终结七连跌（来源：韩国产业通商资源部/Wind，2026-08-15）

## 宏观机会 / 风险

### 1. 通胀双数据降温，9 月加息概率降至三成，标普 500 创历史新高
**判断：CPI＋PPI 连续降温已把"9 月加息"从基线情景降级为条件情景，美股风险偏好重回 risk-on，但美联储内部分歧公开化意味着利率路径仍非定局。**

- 标普500 8/13 收 7,798.99（+0.65%），盘中首破 7,800，收盘创历史新高；纳指 +0.81% 报 26,803.03，纳指100 收 30,084.50 时隔一个多月重返 30,000 上方（来源：中新经纬/证券时报，2026-08-14）
- 7 月 PPI 同比 +4.7%（预期 4.9%，前值 5.5%），环比持平；核心 PPI 同比 +4.2% 符合预期，叠加 8/12 CPI 同样回落（来源：美国劳工统计局，2026-08-13）
- CME FedWatch：9 月维持利率不变概率升至 65.7%，加息概率降至约 32%（前一日约 40-48%）（来源：CME FedWatch，2026-08-13）
- 10Y 美债收益率 -5.1bp 至 4.64%，2Y -5.9bp 至 4.139%，30Y 报 5.214%（来源：新浪财经，2026-08-13）
- VIX 盘中最低 14.39，为年内最低水平（来源：证券时报，2026-08-14）

> **组合含义：** 利率敏感的高久期成长资产（AI 硬件、半导体、存储）在收益率回落阶段获得估值支撑；对 A股映射端，海外流动性边际改善是科技板块估值修复的顺风，但传导依赖国内资金风险偏好的同步修复。
> **风险：** 克利夫兰联储主席哈马克重申加息立场并警示美债杠杆与 AI 泡沫，里士满联储主席巴尔金支持按兵不动——分歧公开化意味着 9 月 FOMC 前每一次通胀/就业数据都会重定价路径；7 月美国财政赤字 $4,323 亿（同比 +48%，2021 年 3 月以来最大）构成利率中枢的长期压制。

### 2. 存储超级周期获"投资者日"级验证，涨价叙事从合约价延伸到远期利润模型
**判断：闪迪把存储景气度从"周期涨价"升级为"远期利润模型"验证——AI 推理扩张对 NAND/DRAM 的需求正在被上市公司正式量化为多年增长指引，这是本周存储主线最强的边际信号。**

- 闪迪 8/13 投资者日：指引 2028-2030 财年营收中高双位数复合增长，非 GAAP 毛利率约 80%、营业利润率约 75%、FCF 利润率 50%，并承诺完成业务投资后将 100% 剩余现金返还股东；当日股价 +13.67%，市值升至 $2,277 亿（来源：证券时报，2026-08-14）
- 8/13 美股存储股集体爆发：西部数据 +7.31%、SK海力士 +7.29%、希捷 +4.91%、美光 +4.23%、DRAM ETF（Roundhill）+3.89%（来源：新浪财经，2026-08-14）
- 闪迪预计：2030 年企业数据中心闪存潜在市场规模扩大至 1.2ZB（来源：新浪财经 A股收评引述，2026-08-14）
- 应用材料财报验证 DRAM 是设备需求主引擎：半导体系统收入中 DRAM 占比从 22% 升至 26%（来源：AMAT FY26Q3 财报，2026-08-13）

> **组合含义：** 存储从"3Q26 合约价 +13-18% 涨幅收敛"的担忧阶段切换到"远期利润模型支撑"的验证阶段；持仓中存储链（长鑫科技、科创芯片ETF、SK海力士 ADR、美光）的验证层在加厚。但需注意涨价"二阶导转负"仍是此前的既定事实，本轮是估值修复而非涨价加速。
> **风险：** 闪迪/西数对 NAND 的指引不等于 DRAM 定价；若 9 月合约价谈判（TrendForce 口径）环比收敛快于预期，涨价交易仍有换挡风险；美股存储股单日 +7% 以上的波动率本身说明筹码仍未稳定。

### 3. 设备链景气能见度延伸至 2030 年，国产替代映射获得海外"订单级"背书
**判断：AMAT 财报证明 AI 驱动的设备需求已从"扩产"深化到"DRAM/HBM/先进封装新技术平台"，且客户能见度延伸到 2030 年——对 A股半导体设备板块是验证层利好，但美股股价盘后 -5% 说明"业绩超预期但估值已透支"的预期差同样存在。**

- AMAT FY26Q3：营收 $91.2 亿（+25% 超预期）、调整后 EPS $3.50 创历史新高、毛利率 50.4%、经营现金流 $30.4 亿创历史新高；Q4 指引营收约 $102.5 亿（预期 $95.4 亿）（来源：AMAT 财报/每日经济新闻，2026-08-13）
- 先进封装业务 2026 全年营收预期上调至 +70% 以上（此前 +50%）；CEO 称 2027 年将再迎强劲增长，部分订单沟通已延伸至 2030 年（来源：观点/247wallst，2026-08-14）
- 资本开支侧：台积电 2026 capex 上调至 $600-640 亿（年增约 $200 亿）、美光 2026 capex 上调至 $270 亿，三星与 SK海力士同步加码（来源：biggo finance，2026-08-14）
- 但 AMAT 盘后一度跌约 5-6%（年内股价翻倍后市场预期过高，管理层未明确上调全年设备增速至 30% 以上）；B.RILEY 将目标价从 $790 下调至 $700（来源：新浪财经，2026-08-14）

> **组合含义：** 设备链的"验证层"在海外侧继续加厚（订单、能见度、capex 三要素齐备），A股设备/材料持仓（半导设备ETF、科创半导体设备ETF、安集、罗博特科）处于国产替代＋海外景气双驱动的顺风位。但 AMAT 盘后下跌提示：高预期下"超预期"不够用，A股设备股若快速冲高同样面临预期兑现压力。
> **风险：** 中美设备出口管制若升级将同时冲击订单兑现路径；AMAT 中国收入占比已从 35% 降至 28%，地缘再平衡本身就是行业变量。

### 4. neocloud 财报季集体验证，Nvidia $5,000 亿融资平台落地
**判断：NBIS＋CoreWeave 双双交出"订单/合同/现金流"级验证的财报，neocloud 从"故事层"整体升级为"验证层"，但估值与高波动（高做空比例）使其仍属高贝塔资产。**

- NBIS Q2（8/12 盘前）：总营收 $5.82 亿（+454% 超预期 $5.57 亿），AI 云营收 $5.75 亿（+514%）；指引 FY2026 营收 $30-34 亿、12 月年化 run-rate $70-90 亿；当日 +34.14% 收 $259.20，8/13 收 $255.04（-1.60%）（来源：智通财经/NBIS 财报，2026-08-12）
- CoreWeave Q2（8/11 盘后）：营收利润双超预期，积压订单突破 $1,000 亿（环比 +50%），季后再签 $250 亿客户订单；财报后两日累计 +22%（来源：cryptopolitan/智通财经，2026-08-12）
- 高盛分析师 Duval 给出华尔街最高目标价（GPU 供给约束、Q1 容量全部售罄、轻资产模式）；NBIS 空头占比约 24% free float，财报后空头回补放大涨幅（来源：Yahoo Finance，2026-08-12）
- Nvidia 约 $5,000 亿 AI 基建融资平台持续推进，NBIS 被列为受益者；NBIS 持有 Meta 5 年 $270 亿合同与 Nvidia $20 亿投资（来源：parameter.io，2026-08-13）

> **组合含义：** neocloud 赛道的验证层（订单、预付款、合同覆盖率）已显著加厚，持仓中 NBIS（大小号合计 95 股）与 A股映射标的（协创数据、奥飞数据）同属该赛道，方向性判断为"验证层保留"，但财报后的高波动（单日 ±30% 级别）决定了该板块的仓位含义是高贝塔而非稳定器。
> **风险：** 下一验证节点是 8/26 英伟达财报与行业 capex 指引；若 $5,000 亿融资平台的"循环融资"质疑再度发酵（用新债还旧债的可持续性），neocloud 板块将首当其冲；融资成本（CoreWeave 最新发债利率 9.625%）是行业命门。

### 5. 油价：需求下修与供给扰动多空交织，霍尔木兹"关闭"表态扰动不减
**判断：IEA 下修需求 + 美国库存大增压制油价，但伊朗革命卫队重申"霍尔木兹海峡处于关闭状态"令地缘溢价无法消退——油价进入高波动拉锯，方向未明。**

- 8/13 布油 -2.15% 至 $87.07，WTI -2.43% 至 $81.25（来源：Chosun，2026-08-13）
- IEA 8 月月报：因霍尔木兹航运扰动，下调 2026 年全球需求预期 160 万桶/日（较前次扩大 51 万桶/日）（来源：IEA/Chosun，2026-08-13）
- 伊朗革命卫队海军司令 8/13 晚重申霍尔木兹海峡"处于关闭状态"，对海峡动向保持"全面、坚决掌控"（来源：央视新闻，2026-08-13）

> **组合含义：** 油价是当前宏观通胀传导的最大单一变量：油价回落 → 输入性通胀缓解 → 加息概率下行（利好成长股估值）；油价上行 → 通胀预期回摆 → 利率路径重定价。对 A股组合含义主要在"黄金/有色"仓位的对冲属性变化，而非直接能源敞口。
> **风险：** 霍尔木兹若发生实际航运中断（目前是表态为主），布油突破 $95-100 将推翻"通胀降温"叙事，全部科技仓位的估值假设随之动摇。

## 行业机会 / 风险

### 1. 光模块/CPO：中际旭创入股中石科技引爆板块，产业整合信号强于估值信号
**判断：中际旭创以 17.47 亿受让中石科技 10.47% 股权（55.7 元/股），将散热环节纳入产业链版图——这是 CPO 主线从"订单验证"走向"产业整合"的标志性事件，A股光通信当天最强，但美股光通信 8/13 逆势回调提示产业内部分化。**

- A股 8/14 CPO 概念 +2.95% 领涨全市场，37 股涨超 5%，金戈新材、中石科技、阿莱德、富信科技 20cm 涨停，亨通光电、中瓷电子、剑桥科技 10cm 涨停；CPO 板块主力净流入 ¥138.76 亿（来源：中新经纬/同花顺 iFinD，2026-08-14）
- 中际旭创 8/14 +2.38% 收 ¥943.00；8/13 融资买入 ¥42.7 亿居两市第一（来源：21世纪经济报道/行情数据，2026-08-14）
- 逻辑：800G/1.6T 高端光模块放量后功耗密度持续提升，散热需求显著增量，与中石科技（热管理材料）形成协同（来源：中际旭创公告，2026-08-13）
- 但美股光通信 8/13 逆势走低：Coherent -8%、Lumentum/AAOI -5% 以上（来源：上海证券报，2026-08-14）

> **组合含义：** A股光模块/通信持仓（中际旭创、通信ETF）今日处在最强主线位，产业整合信号说明头部厂商在景气高位主动延伸产业链；但美股光通信回调 + A股 CPO 板块 5 日已累计大涨（通信ETF 5日 +4.55%），"易中天"式的高波动仍在，方向性判断是"验证层＋高拥挤"，保留主线仓位但需注意板块波动放大器属性。
> **风险：** 若美股光通信（Coherent/Lumentum）连续两日下跌形成趋势，A股映射端次日将承压；CPO 板块当日 37 股涨超 5% 属于情绪高潮，需警惕次日分歧。

### 2. 存储：A股存储芯片 +2.27%，长鑫科技成交额登顶全市场
**判断：闪迪投资者日的美股验证传导到 A股，存储芯片成为今日第二强主线，长鑫科技以 ¥198.62 亿成交额居全市场第一且主力净流入 ¥20.61 亿居板块首位——资金在存储链的定价正在从"涨价预期"转向"龙头成交额锚"。**

- A股 8/14 存储芯片概念 +2.27%，居概念板块涨幅第 8；阿莱德 20cm 涨停，蓝箭电子 +11.51%、联芸科技 +11.26%、麦捷科技 +11.09%（来源：证券时报，2026-08-14）
- 长鑫科技 +4.35% 收 ¥55.18，成交 ¥198.62 亿全市场第一，主力净流入 ¥20.61 亿（来源：21世纪经济报道/证券时报，2026-08-14）
- 存储板块主力资金净流入 ¥2.92 亿，84 股净流入，20 股净流入超亿元（来源：证券时报，2026-08-14）
- 持仓侧：协创数据主力净流入 ¥5.35 亿（+3.90%）、云南锗业融资余额期间 +¥5.46 亿（来源：证券时报/两融数据，2026-08-14）

> **组合含义：** A股存储链（长鑫科技、科创芯片ETF、澜起）与美股存储（SK海力士、美光）形成跨市场共振，验证层在加厚；长鑫科技成为全市场成交额第一说明资金关注度已到极值，对持仓的含义是"景气验证＋筹码拥挤并存"。
> **风险：** 成交额第一 + 单日大涨的组合往往是短期情绪高点特征；华虹宏力港股绩后 -11% 提示：财报兑现不及预期的存储/晶圆标的会被快速定价。

### 3. 半导体设备：AMAT 订单能见度 2030 + A股设备持仓全线收红
**判断：海外设备龙头的"订单能见度延伸至 2030 年"为国产替代叙事提供最强背书，A股设备/材料持仓今日全线收红，设备板块处于"海外景气＋国产替代"双轮驱动的验证层。**

- A股 8/14 半导体板块 +1.08%（主力净流出 ¥54.75 亿，权重股涨幅温和）；半导设备ETF（159516）+0.95%、科创半导体设备ETF（588710）+0.96%（来源：westock 行情/同花顺，2026-08-14）
- 持仓：安集科技 +2.35%、罗博特科 +1.67%、澜起科技 +0.80%（来源：westock 行情，2026-08-14）
- AMAT：DRAM/HBM/先进封装六款新设备发布（Centura Prime Epi、Opta Quad CMP、Nokota VMax 2 ECD 等），AI 设备需求从扩产延伸到新技术平台（来源：biggo finance，2026-08-14）

> **组合含义：** 设备/材料持仓（半导设备ETF、科创半导体设备ETF、安集、罗博特科）处于验证层核心，方向性判断为"保留"，逻辑为国产替代渗透率提升 + 海外 capex 上修双重驱动；但注意当日半导体板块主力净流出 ¥54.75 亿，说明大资金在上涨中减仓，短线情绪与中线逻辑背离。
> **风险：** AMAT 盘后 -5% 若在 8/14 美股延续，将压制 8/17 A股设备板块开盘；出口管制升级是国产替代逻辑的"双刃剑"（短期利好国产、中期扰动供应链）。

### 4. PCB/CCL：涨价主线延续，融资资金加速涌入
**判断：PCB 板块 8/14 +2.12%（主力净流入 ¥22.39 亿）延续近一周主线地位，融资盘（生益 +¥11.99 亿、胜宏 +¥16.63 亿）与产业涨价（8 月电子布 +17-18%）共振，PCB 是当前 A股少数"涨价可验证 + 资金持续流入"的双验证主线。**

- 8/14 PCB 概念 +2.12%，瑞丰高材 +16%，共进股份、杭电股份、华正新材涨停（来源：新浪财经，2026-08-14）
- 两融（截至 8/13）：生益科技融资余额期间 +¥11.99 亿（至 ¥39.91 亿）、胜宏科技 +¥16.63 亿居两市第一（来源：证券时报，2026-08-14）

### 3. A股两融余额连续回升，风险偏好修复但未过热

**判断：杠杆资金从"恐慌撤离"转向"选择性回补"，但追高意愿在 4000 点附近明显减弱。**

## 行业机会 / 风险

### 4. Nvidia 联手华尔街 $5,000 亿算力融资平台：AI 基建逻辑质变

**判断：这是本周最重要的行业催化剂——GPU 从"折旧品"被重新定义为"可投资资产类别"，AI 基建融资瓶颈有望突破。**

- Nvidia 8/10 宣布与 Apollo、BlackRock、Blackstone、Brookfield、Goldman Sachs、KKR 签署 MOU，设立独立算力融资平台，目标调动超 $5,000 亿第三方资本（Nvidia 官方公告 8/10）
- 黄仁勋："这是技术芯片首次成为一种具备投资价值的资产类别"，资本方获得与算力使用情况挂钩的长期收益（CNBC 采访 8/10）
- 贝莱德 CEO 芬克将其类比 1970 年代 MBS 诞生——"金融工程未来新篇章"（澎湃新闻 8/11）
- 2026 年全球科技巨头 AI 资本开支合计预计超 $7,300 亿（Reuters 8/11）

> **组合含义：** 这个事件对 AI 基建全产业链是结构性利好——光模块（数据中心互联需求）、半导体设备（扩产加速）、存储（HBM/DRAM 需求）、neocloud（算力租赁商业模式获得资本背书），全部受益。$5,000 亿不是一次性投放，但示范效应可能降低整个 AI 产业链的融资成本。A 股映射最直接的是光模块（中际旭创/新易盛/天孚通信）、算力租赁（奥飞数据）和半导体设备（北方华创/中微公司，但你的持仓通过 ETF 间接持有）。
> **风险：** MOU 尚未转为正式协议，实际部署进度不确定；$5,000 亿是长期上限，不会改变短期供需。若资本过热导致盲目建设，2-3 年后可能出现算力过剩。短期 Nvidia 股价在消息后跌近 3%，说明市场已部分 price-in。

### 5. 光模块 FCC 限制落地温和，"易中天"深V反弹

**判断：政策风险"由暗转明"且方向比预期温和，光模块板块进入情绪修复窗口。**

- 网传 FCC 限制从"大范围限制"调整为"小幅收紧准入认证"，海外大厂联合反对进一步强化温和判断（中新经纬 8/11）
- 8/11 盘中中际旭创从跌超 2% 直线拉升收涨 5.44% 至 ¥886.96，新易盛涨 3.93%，天孚通信翻红；光模块板块主力净流出仅 ¥11.7 亿，较前期显著收窄（盘中数据 8/11）
- 中际旭创 H 股获摩根大通（持股 13.48%→15.02%）/高盛（11.65%→12.19%）/中金密集增持；韩国投资者近一月净买入 3.4 亿港元，居韩国投资者净买入港股榜首（港交所披露 8/5-8/10）
- 光模块龙头 1.6T 产品持续放量，订单排期至 2028 年（业内信息 8/11）

> **组合含义：** 你的光模块持仓（中际旭创占 A 股市值 ~17%，通信 ETF 占 ~7%）是当前受益最直接的赛道。FCC 风险出清 + Nvidia $5000 亿融资 = 双重催化剂。中际旭创 H 股获顶级机构密集增持，是强信心信号。但需注意：板块今日深 V 反弹后，追高风险上升。
> **风险：** "温和"不等于"解除"——FCC 最终条款细节未公布，政策仍有变数。1.6T 产品若量产进度不及预期，当前高估值缺乏安全边际。Coherent（光通信美股龙头）隔夜跌超 10%，海外光通信情绪仍脆弱。

### 6. 存储"超级周期"验证，供需缺口至少延续至 2027

**判断：DRAM 供不应求格局已从"预期"进入"财报验证"阶段，但股价与基本面出现认知分歧。**

- 然而全球存储股价同步回调：三星/美光/SK 海力士 ADR 均出现阶段性回撤
- Roundhill 存储 ETF (DRAM) 自 4 月上市涨 93%，创 ETF 史上最快达 $250 亿 AUM 纪录（TradingView 8/10）

> **组合含义：** 你的存储相关持仓——澜起科技（CXL/DDR5 双寡头，+58% 浮盈）、长鑫科技（DRAM 新上市）、科创芯片 ETF（含存储权重）——处于"高景气+高拥挤"的第二阶段。基本面无需质疑，但高估值意味着对负面消息（如存储价格转跌预期、美光指引下调）极其敏感。策略上属于"保留底仓、警惕拥挤"。
> **风险：** 三星/美光若在下季度指引中释放供给加速信号，存储涨价预期可能提前松动。NAND Flash 2027 下半年供给可能趋向宽松。澜起科技浮盈 +58% 已超 50% 止盈阶梯第二档，考虑止盈策略。

### 7. Neocloud 赛道加速升温：NBIS 获 $10 亿合同 + 专项 ETF 推出

**判断：Neocloud 从"概念验证"进入"合同兑现期"，NBIS 是当前赛道最强锚定标的。**

> **风险：** NBIS PS 8000+ 意味着任何收入不及预期都会触发剧烈杀估值。纽约州禁令可能向其他州扩散。一旦 AI 资本开支叙事出现裂缝，neocloud 是第一批被抛售的资产。你已部分止盈，保留的仓位属于 runner。

      t = t.replace(/&lt;span\s+style="color:red"&gt;/g, '<span class="up">')
           .replace(/&lt;span\s+style="color:green"&gt;/g, '<span class="down">')
           .replace(/&lt;\/span&gt;/g, '</span>');
      // Bold
      t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      return t;
    }

    function closeList(){ if(inUL){out+='</ul>';inUL=false;} if(inOL){out+='</ol>';inOL=false;} }
    function closeBQ(){ if(inBQ){out+='</blockquote>';inBQ=false;} }

    function flushTable(){
      if(!inTable || tableRows.length === 0) return;
      out += '<table><thead><tr>';
      tableHeaders.forEach(function(h){
        out += '<th>' + inline(h) + '</th>';
      });
      out += '</tr></thead><tbody>';
      tableRows.forEach(function(row){
        out += '<tr>';
        row.forEach(function(cell){
          out += '<td>' + inline(cell) + '</td>';
        });
        out += '</tr>';
      });
      out += '</tbody></table>';
      inTable = false;
      tableRows = [];
      tableHeaders = [];
    }

    function parseTableRow(line){
      // Remove leading/trailing pipes
      var trimmed = line.trim();
      if(trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
      if(trimmed.charAt(trimmed.length-1) === '|') trimmed = trimmed.slice(0,-1);
      return trimmed.split('|').map(function(c){ return c.trim(); });
    }

    function isSeparator(line){
      return /^\|?[\s-:|]+\|?$/.test(line.trim()) && line.indexOf('-') >= 0;
    }

    for(var i=0;i<lines.length;i++){
      var line = lines[i];

      // Table detection
      if(line.indexOf('|') >= 0 && line.trim().charAt(0) !== '-'){
        var cells = parseTableRow(line);

        // Check if next line is a separator
        if(!inTable && i+1 < lines.length && isSeparator(lines[i+1])){
          inTable = true;
          tableHeaders = cells;
          i++; // skip separator line
          continue;
        }

        if(inTable){
          // Check if this line is still a table row
          if(line.trim().indexOf('|') >= 0){
            tableRows.push(cells);
            continue;
          } else {
            // End of table
            flushTable();
          }
        }
      } else if(inTable){
        flushTable();
      }

      if(/^### /.test(line)){ closeList();closeBQ(); out+='<h3>'+inline(line.slice(4))+'</h3>'; }
      else if(/^## /.test(line)){ closeList();closeBQ(); out+='<h2>'+inline(line.slice(3))+'</h2>'; }
      else if(/^# /.test(line)){ closeList();closeBQ(); out+='<h1>'+inline(line.slice(2))+'</h1>'; }
      else if(/^---+$/.test(line.trim())){ closeList();closeBQ(); out+='<hr>'; }
      else if(/^&gt; /.test(line)){ closeList(); if(!inBQ){out+='<blockquote>';inBQ=true;} out+='<p>'+inline(line.slice(5))+'</p>'; }
      else if(/^- /.test(line)){ closeBQ(); if(!inUL){closeList();out+='<ul>';inUL=true;} out+='<li>'+inline(line.slice(2))+'</li>'; }
      else if(/^\d+\. /.test(line)){ closeBQ(); if(!inOL){closeList();out+='<ol>';inOL=true;} out+='<li>'+inline(line.replace(/^\d+\. /,''))+'</li>'; }
      else if(line.trim()===''){ closeList();closeBQ(); }
      else { closeList();closeBQ(); out+='<p>'+inline(line)+'</p>'; }
    }
    closeList();closeBQ();flushTable();
    return out;
  }

  function renderReport(d){
    var mdEl = document.getElementById('md-' + d);
    if(!mdEl){ reportEl.innerHTML = '<div class="loading">报告不存在</div>'; return; }

    reportEl.classList.remove('show');

    setTimeout(function(){
      var md = mdEl.textContent.trim();
      var html = parseMarkdown(md);

      // Split into sections by ## headers for card layout
      var sections = splitSections(html);

      reportEl.innerHTML = sections.map(function(s){
        return '<div class="md-card"><div class="md">' + s + '</div></div>';
      }).join('');

      // Trigger animation - clear inline opacity first to let CSS class take effect
      reportEl.style.opacity = '';
      requestAnimationFrame(function(){
        reportEl.classList.add('show');
      });
    }, 200);
  }

  function splitSections(html){
    var parts = [];
    var h1Match = html.match(/<h1[^>]*>[\s\S]*?<\/h1>/);
    var h2Regex = /<h2[^>]*>[\s\S]*?(?=<h2|$)/g;
    var h2Matches = html.match(h2Regex) || [];

    if(h1Match){
      var afterH1 = html.slice(h1Match.index + h1Match[0].length);
      var firstH2 = afterH1.indexOf('<h2');
      var intro = firstH2 >= 0 ? afterH1.slice(0, firstH2) : afterH1;
      parts.push(h1Match[0] + intro);
    }

    h2Matches.forEach(function(m){ parts.push(m); });

    return parts.length ? parts : [html];
  }

  // Initial render
  renderReport(current);
})();
</script>
