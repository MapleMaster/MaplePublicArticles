# 市场简报：宏观与行业机会/风险（2026-07-22）

## 宏观机会 / 风险

**全球风险偏好修复严重不同步：美股芯片股暴力反弹，A股科技板块继续杀跌。** 7月21日隔夜美股三大指数全线收涨，道指涨0.74%报52,224.64点，标普500涨0.89%报7,509.20点，纳斯达克涨1.29%报25,837.21点（新华社，2026-07-22）；费城半导体指数暴涨5.21%，美光科技涨超12%至$970.82，英特尔涨8.64%至$105.45，光通信概念股AAOI涨超12%、Coherent涨逾11%、Lumentum涨超9%（财联社，2026-07-22）。然而7月22日A股与港股并未跟随，上证指数微涨0.07%报3,867.03点但深证成指跌1.42%、创业板指跌3.23%、科创综指跌2.25%，全市场3,876只个股下跌、仅1,530只飘红，通信板块领跌-4.44%（上海证券报，2026-07-22）；港股恒生指数跌0.95%报24,892.66点，恒生科技指数跌3.04%，腾讯跌7.05%、网易跌7.39%（财联社，2026-07-22）。与此同时，资金并未撤离——7月至今股票型ETF净流入¥3,717亿，宽基ETF揽入¥2,289亿，中国国新与中国诚通合计超¥600亿入市（21世纪经济报道，2026-07-22）。组合含义是：中美科技股的节奏差正在扩大，美股财报前的FOMO回补不等于A股科技端同步修复，仓位应保留在有订单和资金面支撑的强主线，回避情绪性追涨杀跌。风险在于美股财报季业绩"利好出尽"后A股映射端再度承压。

**美债收益率高位运行，长久期估值继续承压。** 7月21日美国10年期国债收益率报4.63%，日内升3bps，2年期报4.26%，升5bps，2s10s利差+37bps（YieldCurvesToday，2026-07-21）；美债收益率曲线整体上移，30年期达5.13%。中国端，10年期国债收益率稳定在1.75%，7月LPR连续14个月维持不变，5年期3.5%、1年期3%（中证债券估值日报，2026-07-21）。中美利差深度倒挂约288bps，叠加美元指数维持在100.82-101区间（DollarMetal，2026-07-21），人民币汇率在6.77附近窄幅波动。对仓位的直接含义是，A股高估值成长股的折现率约束未解除，但国内低利率环境对红利和低波资产仍有支撑，配置上不宜对长久期高估值标的过度加杠杆。风险在于油价持续上行可能推高美国通胀预期，进一步推迟美联储降息甚至重启加息讨论。

**中东地缘风险从条件性情景向基线情景滑动，能源与黄金同步走高。** 美军对伊朗实施连续第11晚空袭，伊朗反袭美国在巴林、科威特和约旦的设施，霍尔木兹海峡至少一艘油轮遭袭，7月21日仅3艘大宗商品船通过该海峡，无超大型油轮或LNG运输船通行（新华社，2026-07-22）。胡塞武装7月20日宣布对沙特实施海上禁运，冲突风险从海湾扩散至红海航线。布伦特原油涨2.01%至$91.01/桶、WTI涨2.02%至$84.91/桶，均创6月中旬以来新高（新华社，2026-07-22）。现货黄金7月22日盘中突破$4,100/盎司，截至11:28报$4,138.30/盎司，涨1.5%（金价查询网，2026-07-22）。高盛极端情景为若供应中断持续到四季度，布伦特可能上冲$120/桶以上，但这不是基线判断；TP ICAP警告若紧张持续数周，布伦特或破$100/桶（汇通网，2026-07-21）。净结论是：能源通胀和航运风险对航空、化工和高能耗制造构成基线性利空，对油气、炼化和黄金形成条件性利多，具备自备电源能力的数据中心基础设施也间接受益。风险在于停火谈判突然取得突破导致油价和避险资产快速回吐。

**A股市场处于政策托底与杠杆出清的拉锯阶段，风格从极端分化向均衡回归。** 7月22日沪深两市成交额¥26,533亿，较前日缩量¥3,037亿（中新经纬，2026-07-22）；两市融资余额截至7月21日报¥26,895.21亿，仅微增0.62亿元，杠杆资金出清接近尾声但尚未完成（财联社，2026-07-22）。盘面呈现"煤飞色舞"行情，贵金属、煤炭、油气、电力板块领涨，而通信、光学光电、电池、机器人等科技板块跌幅靠前。证监会7月20-21日密集召开系列座谈会，强调"增强资本市场内在稳定性"，中国国新、中国诚通先后宣布大额增持（博时基金点评，2026-07-22）。行业含义是：短期市场波动率仍高，但政策底与资金底正在形成，风格上从此前极端的"科技独强"向"红利+科技轮动"过渡，不宜将宽基反弹等同于全面风险偏好回升。风险在于月底政治局会议政策定调不及预期，或地缘局势进一步恶化打断修复进程。

## 行业机会 / 风险

**neocloud投资质量继续改善，合同覆盖率与客户预付款成为核心验证指标。** IREN新签$28亿多年度AI云合同后，将2026年底年化运营收入目标上调至$40亿以上，其中约85%已被合同覆盖，客户预付款覆盖近45%的GPU资本开支；公司容量从约3MW扩张至2026年的480MW，规划2027年达1.2GW（The Block/同花顺，2026-07-21）。Hut 8签署15年、$98亿租赁协议，Beacon Point园区1GW全面商业化的总合同价值达$196亿，含续约选项潜在总值$502亿（The Block，2026-07-21）。Nebius(NBIS)7月21日暴涨18.78%至$216.92，英伟达向SEC披露持有9.3%受益所有权，Northland将目标价从$248上调至$410（Barchart/同花顺，2026-07-21）。Gartner预测到2030年neocloud将占$2,670亿AI云市场的20%份额，即$534亿收入（同花顺，2026-07-22）。行业含义很清晰：需求已从主题层面转化为土地、电力、债务和长期租赁的真实资本开支，最值得布局的是能让客户提前出钱、将资本密集部分转移给需求侧的运营商。风险在于重资产扩张、客户集中度、电价与债务成本上行，以及GPU代际迭代导致的残值风险。

**存储仍是最强的景气主线，但已进入"高景气+高拥挤"的第二阶段，反弹剧烈但波动同步放大。** 美光科技7月21日反弹12.17%至$970.82，Roundhill DRAM ETF涨10.91%至$58.85（westock-data，2026-07-21）。TrendForce 7月3日报告显示，3Q26整体DRAM合约价预计季增13%-18%，NAND Flash季增10%-15%，涨幅较前几季收敛但格局仍"极度紧缺"；服务器DDR5价格环比涨10%-20%，eSSD涨25%-30%，AI服务器需求仍是核心动能（TrendForce，2026-07-03）。DDR5 16Gb现货均价$50.067，日内涨0.60%（TrendForce，2026-07-21）。国盛证券援引TrendForce预判2026下半年价格仍具70%-75%上行空间（国盛证券，2026-07-03）。这意味着主线没有结束，但交易方式必须从高杠杆追价切回"回调后只买有价格、订单和产能兑现的龙头"。风险在于把2026年的紧缺简单线性外推到2027年以后——消费端价格承受力已达极限，若AI推理需求增速放缓，供需格局可能逆转。

**光通信出现"美股强反弹、A股深回调"的鲜明分化，A股映射端进入挤泡沫阶段。** 美股端，AAOI 7月21日涨超12%，全年营收指引上调至超$11亿，已获某hyperscaler超$2亿1.6T订单；Coherent数据中心订单排至2028年；Lumentum InP产能再增50%，1.6T光模块交付第一梯队，OCS签下数十亿美元多年期协议（东吴通信，2026-07-10）。然而A股端7月22日深度回调：中际旭创跌6.66%至¥1,060.80，天孚通信跌5.79%至¥217.63，通信板块整体跌4.44%（westock-data/上海证券报，2026-07-22）。港股长飞光纤光缆跌10.28%至HK$127.40，富瑞将其评级由"买入"下调至"持有"，认为全球大幅扩产将逐步消除供需缺口，2026-2027年盈利或为周期性顶部（智通财经，2026-07-22）。净结论是：光通信海外需求验证层（订单、客户、收入指引）仍然强劲，但A股映射端缺少新增订单和利润归因的直接验证，且面临供给端扩产担忧，只能放在观察主线而非追涨方向。风险在于CPO技术路线加速替代可插拔模块，改变现有价值链分配格局。

**半导体设备处于"政策催化+业绩预增+资金逆势流入"的偏强阶段，但短期受板块情绪拖累。** 7月22日长川科技跌2.81%至¥309.05，但7月21日曾涨停+20.00%至¥318.00，显示高波动下的资金博弈（westock-data，2026-07-22）。资金面逆势布局：7月13-20日科创芯片ETF嘉实区间下跌22.47%但净流入¥58.85亿，半导体设备ETF易方达区间下跌29%但净流入¥26.48亿，通信ETF国泰净流入¥22.47亿（证券之星，2026-07-22）。芯片ETF国泰近20日净流入¥15.69亿（每日经济新闻，2026-07-22）。AI算力需求驱动半导体产业链上半年业绩大面积预增，最高预增743倍（同花顺，2026-07-22）。行业含义是：半导体设备和芯片方向的长期逻辑（国产替代+AI算力需求）未变，资金"越跌越买"的行为表明机构资金认可底部区域，但短期高波动下不宜追涨，适合回调后分批布局有订单和产能兑现的龙头。风险在于美国关税政策进一步收紧对半导体供应链的冲击，以及估值在高波动中持续压缩。

**PCB与覆铜板赛道今日出现集体暴跌信号，供给端扩产担忧开始定价。** 建滔积层板(01888.HK)7月22日暴跌15.28%至HK$40.26，建滔集团跌10.17%（财联社，2026-07-22）；A股生益科技跌7.13%至¥126.00，中国巨石跌停-10.00%至¥38.70（westock-data，2026-07-22）。消息面上，烽火通信定增募资不超¥29.13亿扩产光纤制造，领益智造跨界切入富通嘉善重整，行业供给端快速增长引发份额流失担忧（智通财经，2026-07-22）。但高盛最新预测显示，全球AI服务器CCL覆铜板市场规模将从2024年的$15亿增至2027年的$187亿，2026和2027年增速分别达142%和222%（财联社，2026-07-22）。这意味着长期需求逻辑未变，但短期供给冲击和情绪宣泄可能持续，当前位置属于"长期逻辑强+短期杀跌猛"的矛盾阶段。风险在于扩产进度超预期导致供需缺口提前闭合，价格战压缩利润空间。

# 市场简报：宏观与行业机会/风险（2026-07-23）

## 宏观机会 / 风险

**美股风险偏好进入芯片反弹后的喘息期，Google财报同时验证了AI需求的真实性与资本开支的代价。** 7月22日（周三）美股收盘，标普500报7,498.96点（-0.14%），纳斯达克报25,690.90点（-0.57%），费城半导体指数微涨0.44%，与前一日SOX +5.21%的暴力反弹相比明显减速（来源：中新经纬/Wind，2026-07-22）。大型科技股多数下跌——Meta -2.58%、微软 -1.86%、特斯拉 -1.30%、亚马逊 -1.09%、谷歌 -1.24%，仅英伟达 +2.30%延续独立走势；超微电脑 +19.84%和戴尔 +9.32%则反映AI硬件链的局部热度。盘后谷歌母公司Alphabet发布二季度财报：营收1,198亿美元（+24% YoY），谷歌云营收248亿美元（+82% YoY），云积压订单升至5,140亿美元，但同时资本开支同比翻倍至449亿美元，自由现金流数十年来首次转负至-58.55亿美元，全年资本开支指引从1,800-1,900亿美元上修至1,950-2,050亿美元，并预计2027年仍将"显著"增加（来源：Alphabet SEC 8-K/每日经济新闻，2026-07-22）。组合含义是：AI基建需求端被 hyperscaler 财报验证为真实且加速，但资本开支飙升对自由现金流的侵蚀正在被市场重新定价，估值压力从"故事端"转向"投入回报端"，Google盘后跌约3%即是此逻辑的即时反应。

**利率仍是压制长久期估值的核心变量，且加息预期在油价推动下快速升温。** 7月22日，美国10年期国债收益率升至约4.63%，创5月21日以来两月新高；2年期收益率约4.255%（来源：Investopedia/Saxo，2026-07-22）。CME FedWatch显示，市场对7月29日FOMC会议加息的概率预期从一周前的不到11%升至24%，对9月会议至少加息25bp的概率从48%升至69%（来源：Investopedia，2026-07-22）。与此同时，美元兑日元突破163，创1986年以来新高，日本当局干预风险上升（来源：华尔街见闻，2026-07-22）。对仓位的直接含义是：高估值、长久期、依赖远期现金流折现的资产（尤其是AI软件和未盈利平台）应继续降权，优先保留有当期现金流或硬资产支撑的方向。

**能源与地缘风险仍在升级，且已从条件性情景向基线情景偏移。** 美伊冲突进入第11天，美军连续11夜对伊朗境内军事目标实施打击，7月22日凌晨德黑兰等多地遭袭；伊朗反击美国在巴林、科威特的军事设施，并袭击了位于巴林的亚马逊中央数据基础设施（来源：新华社/证券时报，2026-07-22）。特朗普威胁"伊朗每次在霍尔木兹海峡开火，美国就轰炸并摧毁一座伊朗桥梁或发电厂"，伊朗议长回应"霍尔木兹海峡状况不会恢复到战前"（来源：央视新闻，2026-07-22）。也门胡塞武装同步对沙特实施海上封锁，曼德海峡风险溢价上升。7月22日布伦特原油收报94.07美元/桶（+3.36%），盘中一度突破95美元，创六周新高；WTI收报86.83美元/桶（+2.95%）（来源：新华社/Trading Economics，2026-07-22）。布伦特过去一个月涨幅21.98%，同比上涨37.24%。美军累计伤亡18人死亡、482人受伤（来源：美国国防部，2026-07-22）。黄金期货升至约4,120美元/盎司。净结论是：能源通胀和航运保险费对航空、化工和高能耗制造构成基线性利空，对油气、炼化和具备自备电源能力的数据中心基础设施形成条件性利多；IEA已警告全球石油供应安全风险不容忽视。

**A股风险偏好表现为缩量普涨中的风格切换——资源与电网接管，科技让位。** 7月23日（周四），上证指数收报3,876.78点（+0.25%），深证成指+0.44%，创业板指+0.25%，但科创50指数大跌3.78%至1,789.69点，科创综指-2.60%（来源：证券时报/央广财经，2026-07-23）。两市成交额约2.2万亿元，较前一日缩量约4,580亿元。全市场4,260只个股上涨、1,208只下跌，128只涨停、2只跌停。板块上，电网设备板块爆发涨超6%（29股涨停），能源金属、油气开采、电池、风电、工业金属全面走强；半导体、电子化学品、存储芯片、先进封装概念下跌。截至7月22日，A股两融余额27,197.75亿元，较前一日增加14.93亿元，其中电子行业融资净买入58.14亿元居首，中际旭创获融资买入68.01亿元（来源：证券时报/21世纪经济报道，2026-07-23）。组合含义是：市场从前一日的集中抛压（7月22日创业板-3.23%）中企稳，但资金选择了低估值资源+电网而非科技反弹，科创板的持续杀跌说明半导体方向的杠杆去化尚未完成。港股方面，恒生指数+1.28%报25,210.81点，恒生科技+0.65%，重型机械、水泥、锂电走强，半导体与存储芯片继续下挫（来源：财联社，2026-07-23）。

## 行业机会 / 风险

**AI基建需求端再次被 hyperscaler 财报验证，但市场焦点从"需求在不在"切换为"投入回报何时兑现"。** Alphabet二季度资本开支449亿美元（同比翻倍），全年指引上修至1,950-2,050亿美元，2027年"显著增加"，云营收+82%至248亿美元，积压订单5,140亿美元（来源：Alphabet财报，2026-07-22）。CFO明确表示"仍处于供不应求的环境中"，约60%技术基础设施投资用于服务器、40%用于数据中心和网络设备，并计划Q3扩大对第三方算力的使用以填补自有产能建成前的缺口（来源：21世纪经济报道，2026-07-23）。摩根士丹利7月12日研报将五大hyperscaler 2027/2028年资本开支预测分别上调至约1.2万亿和1.4万亿美元（来源：智通财经，2026-07-14）。行业含义很清晰：需求不是停留在主题层面，而是已转化为土地、电力、债务和长期租赁的真实资本开支；但Google自由现金流转负说明"投入-产出"的时间错配正在被市场定价。受益链条维持neocloud、数据中心开发、供配电、服务器电源和光通信；主要风险是资金成本上行（10Y美债4.63%）、建设进度落后于需求以及资本回报率不达预期。

**neocloud赛道进入资本密集爆发期，投资质量继续改善但拥挤度同步上升。** 7月21日，IREN宣布28亿美元多年度AI云合同，将2026年底年化收入目标从37亿上调至超40亿美元（85%已签约），容量从480MW规划扩张至2027年1.2GW；Hut 8签署15年98亿美元租约（含延期选项潜在总价值超500亿美元），签约容量翻倍至704MW；英伟达通过SEC文件正式披露持有Nebius 9.3%受益所有权（约20亿美元），Wolfe Research预测Nebius 2030年营收达300亿美元（来源：智通财经/Barrons，2026-07-21）。Nebius 7月14日另签Reflection AI超10亿美元算力协议至2029年（来源：智通财经，2026-07-14）。NBIS 7月22日收报218.16美元（+0.57%），盘后225.00美元（+3.08%），从6月22日高点299.86美元回落约27%（来源：市场数据，2026-07-22）。阶段定性：neocloud已从"主题映射"进入"合同与产能兑现期"，最值得关注的不是概念股而是能让客户预付资本开支的运营商。风险在于重资产扩张的杠杆风险、客户集中度以及电价与债务成本上行。

**存储仍是最强景气主线，但已进入"高景气+高拥挤"的第二阶段——涨幅收敛、回撤后反弹、杠杆未清。** TrendForce 7月3日报告预计3Q26 DRAM合约价季增13%-18%（2Q26实际涨幅58-63%，1Q26为90-95%），NAND季增10%-15%，涨幅明显收敛但方向仍上行（来源：TrendForce/环球网，2026-07-03）。DDR4 8Gb 6月合约价21美元（月涨5%），NAND 128Gb 28.8美元（月涨8.7%，连涨18个月）（来源：DRAMeXchange/新浪财经，2026-07-01）。美光FY2026 Q3（6月24日发布）营收415亿美元（环比+74%），非GAAP毛利率84.9%，下季度指引营收约500亿美元、毛利率约86%（来源：Luminix，2026-07）。7月22日美股存储板块在前一日暴涨后分化：美光-1.17%、SK海力士-3.88%、闪迪-0.62%，西部数据+1.51%、希捷+1.82%；Roundhill Memory ETF（DRAM）盘前跌超3%（来源：Investopedia，2026-07-22）。A股存储芯片和先进封装概念7月23日继续下跌。行业含义：主线没有结束，但交易方式必须从高杠杆追价切回"回调后只买有价格、订单和产能兑现的龙头"。风险在于把2026年的紧缺简单线性外推到2027年以后——客户侧库存已从2-4周升至7-9周，接近8周早期预警线（来源：Luminix，2026-07）。

**光通信海外龙头产能售罄至2029年，但A股映射端出现"海外强、国内弱"的分化加剧。** Lumentum（LITE）产能已售罄至2029年，EML芯片供需缺口约30%，FY2026 Q3营收8.084亿美元（+90.1% YoY），Q4指引上修至9.60-10.10亿美元（来源：行业分析，2026-07）。AAOI Q1 2026营收1.511亿美元（+51% YoY，连续4季创新高），数据中心营收+154% YoY，1.6T首笔批量订单超2亿美元，800G月产能从10万套目标年底65万套，全年营收指引上修至超11亿美元（来源：AAOI财报/TipRanks，2026-05-07）。但AAOI股价近期单日暴跌12.99%，反映高估值成长股在指引不及预期时的脆弱性。A股端，7月23日中际旭创收报1,072.52元（+1.10%），天孚通信收报212.09元（-2.55%），CPO板块-0.56%；通信ETF国泰（515880）+3.43%，近30日净流入172.46亿元（来源：市场数据/每日经济新闻，2026-07-23）。行业含义：海外光通信龙头的订单和产能数据属于验证层信号，但A股映射端在科创板整体杀跌环境中难以独立走强，当前处于"基本面强、股价受板块beta拖累"的阶段。风险在于A股光模块标的缺少当期新增订单和利润归因的独立验证，且科创板杠杆去化未完成。

**半导体设备与材料链遭遇科创板杀跌的集中冲击，资金净流出。** 7月23日，半导设备ETF国泰（159516）收报0.72元（-3.61%），成交46.31亿元，资金净流出5.83亿元；科创芯片ETF（588200）同步下跌（具体收盘价未获数据），科创50指数-3.78%（来源：同花顺/每日经济新闻，2026-07-23）。长川科技收报291.24元（-5.76%），前一日曾+20.00%涨停（7月21日），两日振幅极大。中国巨石收报38.36元（-0.88%），前一日跌停（-10.00%），今日有所企稳但仍未收复失地。生益科技收报125.10元（-0.71%），相对抗跌。港股端，建滔积层板收报40.70港元（+1.09%），前一日暴跌15.28%后小幅反弹；长飞光纤光缆收报125.80港元（-1.26%），连续多日回调（来源：市场数据，2026-07-23）。行业含义：半导体设备和材料链的回调更多是科创板beta去杠杆的系统性冲击而非基本面恶化，但短期内资金流出和情绪偏弱构成实际压力。主要风险是科创板杠杆去化尚未完成时，个股基本面利好难以有效定价。

# 市场简报：宏观与行业机会/风险（2026-07-24）

## 宏观机会 / 风险

美股科技股去杠杆从"回调"演变为"抛售"，风险偏好全面回落。7月23日（周四）道指跌506.93点（-0.97%）收51,711.65点，标普500跌90.66点（-1.21%）收7,408.30点，纳指跌553.21点（-2.15%）收25,137.69点（新华社，7/23）。龙头股的崩塌信号极为清晰：特斯拉单日跌14.5%，二季度自由现金流转为负10.9亿美元，资本开支同比飙升至57.89亿美元（+142%），调整后EPS $0.33远低于预期$0.51（界面新闻，7/23）；Alphabet跌逾7%，二季度自由现金流负58.55亿美元为上市以来首次，并将2026年资本开支指引从1,800-1,900亿美元上修至1,950-2,050亿美元（每经，7/23）。与此同时，VIX在连续三日下跌后反弹2.81点至19.45点（新浪财经，7/23），说明市场定价已从"回调"切换至"风险事件"。组合含义是：AI资本开支的"烧钱-增收"剪刀差正被市场重新审视，买单方（Alphabet、Tesla）的现金流恶化压低估值，卖方（Micron、neocloud）短期受益但估值同样受长久期折现压制。风险在于如果资本开支上修引发的不是"更多订单"而是"对回报可持续性的质疑"，整个AI链的风险溢价将同步抬升，当前判断仍为基线情景下的阶段调整而非趋势反转。

利率环境从"高利率"向"加息预期"切换，对长久期估值构成边际压制。7月23日10年期美债收益率上涨5bp至4.71%，创2025年1月以来18个月新高；30年期升至5.188%，年内已有27个交易日维持5%以上（华尔街见闻，7/23）。Bloomberg同日报道，2年期收益率升至约4.34%，初请失业金人数降至18.7万（预期21.2万），强化了美联储短期不降息的预期；芝商所FedWatch显示7月加息概率超过33%，9月加息概率升至78%以上（前日约61%）（Trading Economics/Bloomberg，7/23）。这意味着债市已从"高利率维持"定价切换至"进一步紧缩"定价。对仓位的直接含义是：AI软件、订阅模式和缺乏订单兑现的高估值品种应继续降权，优先保留算力、电力和已形成现金流闭环的资产。风险在于初请失业金人数骤降如果反映的是劳动力市场韧性而非"过热"，则加息概率的定价可能过度激进，届时长久期资产或有修复性反弹。

能源与航运风险从条件性情景向基线情景移动。布伦特原油7/23收报94.07美元/桶（+3.36%），盘中一度逼近100美元；WTI收86.83美元/桶（+2.95%）；阿联酋穆尔班原油暴涨19.13%至106.60美元/桶（Gulf News/Reuters，7/23）。伊朗革命卫队宣布霍尔木兹海峡"完全关闭"，胡塞武装声称在红海袭击两艘沙特油轮并试图封锁沙特航线，美军已连续第12夜对伊朗发动打击（Reuters，7/23）。高盛预计油价将在7-8月维持近期涨幅，因全球库存持续下降、中东产量下降和夏季出行需求支撑。布伦特原油7月涨幅有望跻身过去十年单月涨幅前三（华尔街见闻，7/23）。净结论是：能源通胀对航空、化工和高能耗制造构成基线性利空，对油气、炼化和具备自备电源能力的数据中心基础设施形成条件性利多。风险在于地缘冲突的不可预测性——任何一方误判导致实际供油中断，油价可能进一步跳升至高盛极端情景的120美元/桶以上，但这不是当前基线判断。

A股进入"杠杆去化后半段"，半导体逆市承接但整体风险偏好仍处脆弱修复。7月24日沪指跌1.61%收3,814.20点，深证成指跌2.47%，创业板指跌2.65%收3,480.87点，科创综指跌1.05%，全市场超4,900只个股下跌，三市合计成交1.9444万亿元，较上日缩量2,650亿元（证券时报/每经，7/24）。7月23日两融余额为27,103.13亿元，较前一交易日减少94.62亿元（证券时报，7/24）。招商证券指出当前市场已呈现"杠杆去化、交易降温、ETF托底"三位一体特征，融资出清进入后半段，强势科技股补跌意味着恐慌盘集中释放，进一步下行空间有限（证券时报，7/24）。与此同时，半导体设备ETF（159516）逆市收涨3.06%，成交额超51亿元，长川科技涨4.21%，显示资金并未放弃硬科技主线。组合含义是：不宜把宽基反弹等同于风险偏好全面回升，更适合保留有订单兑现路径的科技分支和国产替代方向，对纯题材、高杠杆追价品种保持降权。风险在于如果缩量持续且杠杆去化加速，指数可能进一步下探3,700-3,750区间寻找支撑。

港股"地量"调整，南向资金净卖出但银行股逆势创新高。7月24日恒生指数跌0.98%收24,963.23点，恒生科技指数跌1.47%收4,629.51点，全天仅成交2,099亿港元为今年"地量"水平（每经，7/24）。板块上，银行股维持强势，中银香港（02388）大涨近6%创历史新高HK$51.25，总市值5,419亿港元；而PCB概念股下挫，建滔积层板（01888）跌超7%，科网股普跌，阿里巴巴跌超4%，南向资金净卖出超15亿港元（每经，7/24）。国元证券认为港股短期大幅下行空间有限，南向资金能维持指数韧性，但趋势性上涨条件尚不充分，外资配置意愿尚未明显改善（每经，7/24）。净结论是：港股当前不具备趋势性做多条件，但结构性亮点在银行高股息和国产科技替代。风险在于海外科技板块调整和地缘风险反复扰动可能进一步压缩流动性。

## 行业机会 / 风险

AI资本开支从"预期"切回"财报验证"阶段，分歧信号已经出现。Alphabet二季度云营收247.68亿美元（同比+82%），积压订单首次突破5,000亿美元至5,140亿美元，但二季度资本开支449亿美元，自由现金流转为负58.55亿美元，公司预计2027年资本开支仍将大幅增长（每经，7/23）。与此同时，AMD与Anthropic达成长期合作——Anthropic自2027年上半年起采购最多2GW搭载AMD Instinct MI450芯片的AI服务器，合作规模达数百亿美元，AMD另投资最高50亿美元（每经，7/23）。Tesla方向则提供反面信号：Q2营收282.4亿美元（+26%）创新高，但运营利润仅3.98亿美元（-57%），毛利率降至16.8%，马斯克称全年资本支出将超250亿美元（界面/每经，7/23）。行业含义很清晰：需求侧的资本开支兑现路径（云订单、合同）仍在验证层，但买单方的现金流恶化已开始约束估值，交易方式应从"追估值"切回"看合同和现金兑现"。风险在于大规模资本开支能否带来与投入匹配的收入增长，仍取决于AI应用层的商业化进展——如果后续财报持续显示买方FCF恶化，资本开支可持续性将被质疑。

neocloud方向投资质量继续改善，但已进入"高景气+高拥挤"第二阶段。NBIS（Nebius）7/23收$220.97（+1.29%），合同收入$47.3B，英伟达披露持有NBIS 9.3%股份，Baird首次覆盖给予Outperform评级和$250目标价，下次财报日8月6日（ziven.io/TipRanks，7/23）。IREN收$40.58（-1.70%），Hut 8收$117.67（+7.11%，年内+154%）（westock-data，7/23）。值得注意的是，NBIS从6/22高点$299.86回落约26%，HUT从6/2高点$140.80回落约16%，但两家均在7/21出现明显反弹（NBIS +18.78%，HUT +7.98%）。行业判断是，neocloud的核心验证层（合同、客户预付、容量扩张）依然坚实，但估值已对远期增长充分定价，波动率显著放大。组合含义是：方向性看多neocloud的逻辑未变，但交易方式必须从"追高"切回"回调后只买有合同覆盖和客户预付支撑的龙头"。风险在于重资产扩张、客户集中度和电价/债务成本上行。

存储仍是最强景气主线，但涨幅收敛信号已出现。美光7/23收$990.21（+3.20%），在纳指跌2.15%的背景下逆市上涨，跑赢纳指5.35个百分点，单日新增市值约350亿美元（ts2.tech，7/23）。TrendForce数据显示3Q26整体DRAM合约价预计季增13-18%（涨幅较前几季收敛），NAND Flash季增10-15%（集邦咨询，7/7）。瑞银大幅上调预期，预计3Q26 DDR环比+32%、NAND+30%，4Q26 DDR+18%、NAND+12%，并认为供需紧张至少持续至2028年上半年（环球网，7/5）。三星年内第三次推动DRAM涨价，目标3Q通用DRAM均价环比上调20%（每经，7/7）。DRAM ETF（Roundhill Memory）7/23收$58.30（+0.92%）（westock-data，7/23）。SK海力士将于7月29日公布Q2财报，是存储链下一个验证节点。行业含义是：存储主线未结束，但合约价涨幅收敛叠加股价已从高点回落20%+，表明市场已部分定价了"景气见顶"预期，交易方式应从"追涨"切回"回调后买有合约和产能兑现的龙头"。风险在于把2026年的紧缺简单线性外推到2027年以后——韩国800万亿韩元扩产计划和美国美光93亿美元扩产将在2027年逐步释放产能。

光通信A股映射端继续杀跌，但1.6T量产交付的验证层信号依然坚实。7月24日中际旭创（300308）收¥1,046.51（-2.43%），天孚通信（300394）收¥203.41（-4.09%，连续3日累计跌11.94%），通信ETF（515880）收¥0.65（-3.73%）（westock-data，7/24）。与此同时，1.6T光模块已进入千万只级别批量交付：中际旭创1.6T硅光CPO模块已通过英伟达GB200服务器平台认证，全球1.6T市占率超50%，在英伟达供应链中拿下约70%订单，订单排至2027年（产业调研/公司公告，7/12）。2026年一季度中际旭创营收近¥195亿（同比+192%），归母净利润约¥57亿（+262%）。但天孚通信20日跌幅已达-36%，通信板块整体20日跌幅-22.45%。行业含义是：光通信的验证层信号（订单、收入、产能）依然坚实，但A股映射端在杠杆去化和风格切换中遭受系统性抛压，属于"基本面未恶化但估值压缩"的阶段。风险在于如果1.6T交付节奏低于预期或客户集中度过高导致订单波动，A股映射端的估值修复将缺乏催化剂。

半导体设备逆市走强，国产替代与AI算力需求双重驱动。7月24日半导体设备ETF（159516）收¥0.74（+3.06%），成交额超51亿元，逆市飘红；长川科技（300604）收¥303.50（+4.21%），中科飞测涨7.43%，拓荆科技涨6.16%，北方华创涨3.49%（westock-data/每经，7/24）。中泰研究指出科技及高制板块是A股交易热度最高的板块，日均成交额达815.57亿元，且是资金流入最多的板块（每经，7/24）。产业层面，AI算力对高性能芯片的需求拉动晶圆厂扩产和技术升级，向上游设备环节传导；国产替代加速推进，设备环节作为产业链基石获得政策和市场持续支持。行业含义是：半导体设备是当前A股少数在市场调整中逆市获得资金净流入的方向，验证层（订单、政策支持）清晰，属于"高景气+国产替代"双轮驱动的主线。风险在于科创半导体材料设备等指数当前估值处于历史高位，如果后续扩产不及预期或国产替代进度放缓，高估值将面临回调压力。

PCB与光纤材料端供给扩产担忧持续定价。7月24日建滔积层板（01888）收HK$37.72（-7.32%），从前高HK$107.20回落64.8%；长飞光纤光缆（06869）收HK$121.10（-3.74%），从前高HK$304.66回落60.2%（westock-data，7/24）。中国巨石（600176）收¥37.34（-2.66%），生益科技（600183）收¥118.71（-5.11%）（westock-data，7/24）。富瑞认为，虽然AI及地缘冲突带动光纤需求，但随着中国及全球大幅扩产，供应增加将逐渐消除短缺情况，长飞光纤可能面临市场份额流失风险，2026-2027年盈利或为周期性顶峰（智通财经，7/24）。行业含义是：材料端供给扩产预期正在系统性压低估值，属于"需求仍在但供给加速"的利空定价阶段，方向上应继续降权材料端敞口。风险在于如果AI算力需求增速超出扩产节奏，短缺可能在2027年重现，当前判断为"供给加速定价"而非"需求崩塌"。

# 市场简报：宏观与行业机会/风险（2026-07-27）

## 宏观机会 / 风险

**美伊暂停互袭是本周最大的边际变化，油价暴跌开启风险偏好修复窗口，但停火的持久性仍存疑。** 7月24日（周五）特朗普未批准当晚作战计划，美军在连续13夜空袭后暂停行动，25日和26日均未报告新袭击，伊朗同步停止报复性回击（经济观察报，7/27）。伊朗与阿曼就霍尔木兹海峡通航的谈判取得"阶段性成果"，美英计划本周在伦敦讨论组建国际护航联盟（汇通财经，7/27）。布伦特原油从7/24收盘的$96.78/桶跌至7/27亚洲盘约$87/桶（跌幅约10%），WTI从$89.31跌至约$84（Reuters/经济观察报，7/27）。A股与港股应声反弹：上证指数7/27收3,858.25点（<span style="color:red">+1.15%</span>），创业板指收3,590.79点（<span style="color:red">+3.16%</span>），恒生指数收25,207.18点（<span style="color:red">+0.98%</span>）（westock-data，7/27）。组合含义是：油价下行对航空、化工和高能耗制造构成条件性利多，对油气和黄金构成利空，整体风险偏好从"防御"向"修复"切换，但停火仍属战术性暂停而非终局——美军弹药库存承压和目标清单耗尽是暂停主因（汇通财经，7/27），不排除重启可能。风险在于任何一方误判导致冲突重启，油价可能快速回补跌幅。

**利率环境仍在高位压制，但油价回落为 Fed 下周会议争取了观察空间。** 7/24收盘10年期美债收益率报4.681%，全周累计上升约13bp至18个月新高；30年期报5.16%，距7/23盘中19年峰值5.201%仅一步之遥（华尔街见闻，7/25）。Fed 下周（7月底）议息会议前，芝商所FedWatch显示加息概率约33%，9月加息已超过完全定价（Economic Times，7/25）。初请失业金人数18.7万远低于预期21.2万，强化了"劳动力市场韧性=不降息"的逻辑（新华社，7/24）。JPMorgan策略师Khuram Chaudry警告"盈利上修很充裕，但修正趋势暗示燃料正在耗尽"（新华社，7/25）。对仓位的直接含义是：长久期高估值品种的折现率约束未解除，但油价回落若持续，将边际缓解通胀预期，为成长股估值修复提供条件性支撑。风险在于油价下跌若被证明是暂时的，利率上行压力将重回定价核心。

**美股以"科技杀估值"结束动荡一周，但周五已现分化企稳迹象。** 7/23（周四）暴跌——纳指-2.15%、S&P 500-1.21%、道指-0.97%，特斯拉单日-14.5%，Alphabet-7%，"七巨头"单日蒸发约$8,000亿市值（新华社，7/24）。7/24（周五）企稳——道指<span style="color:red">+0.46%</span>收51,947.25点，S&P 500<span style="color:red">+0.05%</span>收7,411.98点，纳指<span style="color:green">-0.64%</span>收24,975.82点，VIX回落至18.58（MarketWatch/华尔街见闻，7/25）。全周累计：S&P 500<span style="color:green">-0.61%</span>，道指<span style="color:green">-0.38%</span>，纳指<span style="color:green">-2.13%</span>（华尔街见闻，7/25）。Intel 跌约8%尽管Q2超预期（新华社，7/25），NBIS暴跌15.02%至$187.77（ziven.io，7/24），SK海力士跌8.81%（新浪财经，7/25）。与此同时，房地产和材料板块分别上涨2.36%和1.44%（新华社，7/25），显示资金从科技向防御/实物资产轮动。组合含义是：AI资本开支"烧钱-增收"剪刀差仍被市场审视，但周五分化企稳意味着恐慌性抛售最密集的阶段可能已过。风险在于本周更多财报（微软、Meta、亚马逊）若延续FCF恶化趋势，估值修复将被打断。

**A股杠杆去化进入尾声，周一放量反弹确认"政策底+资金底"正在形成。** 7/27沪深两市成交¥20,766亿元，较上一交易日放量¥1,454亿，5,189只个股上涨、仅286只下跌，206只涨幅超9%（腾讯新闻，7/27）。两融余额截至7/24报26,879.36亿元，连续4周减少，一周净减890.50亿元，其中融资余额26,666.03亿元，一周减少909.64亿元（证券时报，7/27）；7/24单日融资余额减少221.95亿元（东方财富，7/27）。盘面特征：建筑材料尾盘大幅拉升（板块<span style="color:red">+5.44%</span>），玻璃玻纤板块<span style="color:red">+9.65%</span>，中国巨石涨停；通信设备板块<span style="color:red">+3.09%</span>，电子板块<span style="color:red">+2.55%</span>；石油石化逆势下挫（腾讯新闻，7/27）。长鑫科技(688825)登陆科创板首日涨超465%，市值一度超越工商银行登顶A股（IPO电报，7/27）。行业含义是：杠杆去化连续4周累计减少超¥2,500亿后进入尾声，放量反弹确认恐慌盘出清，风格从此前"科技杀跌+红利防御"向"科技企稳+材料突破"切换。风险在于量能若无法持续放大，反弹可能昙花一现。

## 行业机会 / 风险

**PCB/玻纤材料链迎来"量价齐升+估值修复"共振，是今日最强的行业主线。** 建滔积层板7月6日发布年内第六轮涨价函，FR-4板材和PP半固化片提价15%，CEM系列提价10%，铜箔加工费分层上调5-8元/KG，年内FR-4累计涨幅超55%、PP累计涨幅70%（每日经济新闻/腾讯新闻，7/15）。上游电子玻纤布缺口已持续近一年且仍在扩大：7628布从2025年Q3低点¥4.15/米涨至2026年6月¥7.4/米（+78%），高端布用丰田JAT910织机交付周期18-24个月，订单排至2028-2030年（证券时报，7/14）。高端铜箔HVLP4/5月产能1,100吨，需求2,500-3,000吨/月，缺口超48%，英伟达已直接签长协锁货（腾讯新闻，7/15）。央视财经7/27报道高端PCB头部厂商订单已锁定至2027年，高速PCB涨价超3-4倍。今日中国巨石(600176)涨停<span style="color:red">+9.99%</span>收¥41.07，建滔积层板(01888)涨<span style="color:red">+6.52%</span>收HK$40.18，生益科技(600183)涨<span style="color:red">+6.13%</span>收¥125.99，港股芯碁微装(09630)涨<span style="color:red">+19.33%</span>（westock-data/腾讯新闻，7/27）。行业含义是：PCB/玻纤链已从"供给扩产担忧定价"切回"供需缺口+涨价传导"驱动，验证层信号（涨价函、订单锁定、产能缺口）坚实。风险在于韩国800万亿韩元和美光$93亿扩产计划将在2027年逐步释放产能，不宜将2026年紧缺线性外推至2027年以后。

**光通信A股映射端止跌反弹，1.6T量产验证与港股IPO形成双催化。** 今日中际旭创(300308)收¥1,076.94（<span style="color:red">+2.91%</span>），成交额超¥267亿；天孚通信(300394)收¥209.19（<span style="color:red">+2.84%</span>），通信ETF(515880)板块涨<span style="color:red">+3.09%</span>（westock-data，7/27）。天孚通信7/27发布中报预告：归母净利润¥11.2-13.0亿（同比<span style="color:red">+25%-45%</span>），Q2单季中位数约¥7.1亿，较Q1的¥4.92亿明显提升，1.6T高速光器件成为最主要增量来源，券商大幅上调2026-2028年盈利预测至归母净利¥41.15亿/¥87.44亿/¥168.54亿（中财网，7/27）。中际旭创7/30将在港交所挂牌上市，发行价最高HK$1,010/股，募资超HK$550亿，港交所罕见同步推出期权、衍生权证和卖空（IPO电报，7/27）。四大龙头（中际旭创、新易盛、天孚通信、源杰科技）同步发声否认砍单传闻，确认800G和1.6T订单全额覆盖2026全年产能，1.6T硅光方案已批量交付北美云厂商（凤凰财经，7/27）。中际旭创Q1营收¥194.96亿（+192%），归母净利¥57.35亿（+262%），全球市占率55%-60%（雪球，7/27）。行业含义是：光通信从"杀估值"切回"验业绩"阶段，1.6T放量和国产芯片自主是新的增长曲线，验证层信号坚实。风险在于1.6T交付节奏低于预期或客户集中度过高导致订单波动，以及港股IPO期间A股端可能的资金分流。

**存储链进入"涨幅收敛但预期上调"的矛盾阶段，长鑫科技IPO为A股存储提供估值锚。** TrendForce集邦咨询数据显示3Q26 DRAM合约价预计季增13%-18%（较2Q的58%-63%明显收敛），NAND Flash季增10%-15%（集邦咨询，7/7）。但瑞银7月初大幅上调预期：3Q26 DDR环比<span style="color:red">+32%</span>（此前预期+17%），NAND<span style="color:red">+30%</span>（此前+17%），4Q26 DDR<span style="color:red">+18%</span>、NAND<span style="color:red">+12%</span>，并认为供需紧张至少持续至2028年上半年，2027年供需缺口将从2026年的-8.1%恶化至-13.6%（环球网，7/4）。三星计划3Q通用DRAM均价上调最高20%（第一财经，7/4）。今日长鑫科技(688825)上市首日涨超465%，市值一度超工商银行登顶A股第一，发行价¥8.66/股，最高募资¥666.07亿（IPO电报，7/27）。美股端，美光7/24跌5.95%至$931.34，DRAM ETF(Roundhill Memory)跌8.75%至$53.20，SK海力士跌8.81%（新浪财经，7/25）。SK海力士将于7/29公布Q2财报，是存储链下一个验证节点。行业含义是：存储景气主线未结束，但合约价涨幅收敛叠加股价从高点回落20%+，市场已部分定价"景气见顶"预期，交易方式应从"追涨"切回"回调后买有合约和产能兑现的龙头"。风险在于韩国800万亿韩元扩产计划在2027年逐步释放产能，且消费端价格承受力已达极限（华强北建议非刚需暂缓采购）。

**neocloud方向出现"单日暴跌但长期逻辑加强"的矛盾信号。** NBIS（Nebius）7/24暴跌15.02%至$187.77，单日成交$47.08亿，从6/22高点$299.86回落约37%（ziven.io，7/24）。但同期催化剂密集：英伟达通过SEC 13G文件正式披露持有NBIS 9.3%受益所有权（含119万股现有股份+2,106万股预付认股权证，对应约$20亿），Northland将目标价从$248上调至$410（潜在上涨空间124%），采用CoreWeave可比估值框架预测NBIS在$8,000亿AIaaS市场占14%份额（智通财经，7/25）。Broadcom $350亿私人信贷融资方案用于与Anthropic的AI基建扩张，美国银行和摩根士丹利已开始交易部分债权（新浪财经，7/25）。IREN上调全年AI云收入目标至$40亿+（85%已有合同覆盖），Hut 8签署15年$98亿租约（潜在总价超$500亿）（163.com，7/21）。下个财报日8月6日。行业含义是：neocloud验证层（合同、客户预付、容量扩张）持续加强，但单日-15%说明"高景气+高拥挤"第二阶段的波动率显著放大，估值已对远期增长充分定价。组合含义是：方向性看多逻辑未变，但交易方式必须从"追高"切回"回调后只买有合同覆盖和客户预付支撑的龙头"。风险在于重资产扩张、客户集中度和电价/债务成本上行，以及数据中心板块整体情绪降温的传染效应。

**半导体设备链逆市走强但资金分歧加剧，国产替代+AI双驱动逻辑延续。** 半导设备ETF(159516)今日收¥0.768（<span style="color:red">+3.5%</span>），成交¥51.53亿，但主力资金净流出¥2.52亿元，为同类基金流出金额最大（腾讯新闻，7/27）。长川科技(300604)收¥304.70（<span style="color:red">+0.40%</span>），5日累计涨幅<span style="color:red">+14.98%</span>，年初至今<span style="color:red">+201.06%</span>（westock-data，7/27）。科创芯片ETF(588200)收¥1.277（<span style="color:red">+1.51%</span>），成交¥45.69亿（搜狐证券，7/27）。长鑫科技上市首日涨465%+，为整个半导体板块提供估值锚和情绪催化。行业含义是：半导体设备链在"国产替代+AI需求"双驱动下仍处于高景气阶段，但主力资金流出ETF说明短期分歧加大，板块内部可能从"普涨"向"有订单和产能兑现的个股分化"过渡。风险在于如果缩量环境下资金持续流出ETF，板块整体估值可能面临压缩。

<script>
(function(){
  var dates = ['2026-07-27','2026-07-24','2026-07-23','2026-07-22'];
  var switchEl = document.getElementById('date-switch');
  var reportEl = document.getElementById('report-area');
  var current = dates[0];

  // Build date buttons
  dates.forEach(function(d){
    var btn = document.createElement('button');
    btn.className = 'date-btn' + (d === current ? ' active' : '');
    btn.textContent = d.slice(5).replace('-','/');
    btn.onclick = function(){ selectDate(d); };
    switchEl.appendChild(btn);
  });

  function selectDate(d){
    if(d === current) return;
    current = d;
    switchEl.querySelectorAll('.date-btn').forEach(function(b){
      b.classList.toggle('active', b.textContent === d.slice(5).replace('-','/'));
    });
    renderReport(d);
  }

  // Inline lightweight Markdown parser (no external dependency)
  function parseMarkdown(md){
    var esc = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var lines = esc.split('\n');
    var out = '';
    var inUL = false, inOL = false, inBQ = false, inTable = false, tableRows = [];
    var tableHeaders = [];

    function inline(t){
      // Restore span tags for up/down colors (涨红跌绿)
      t = t.replace(/&lt;span\s+style="color:red"&gt;/g, '<span class="up">')
           .replace(/&lt;span\s+style="color:green"&gt;/g, '<span class="down">')
           .replace(/&lt;\/span&gt;/g, '</span>');
      // Bold
      t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      return t;
    }

    function closeList(){ if(inUL){out+='</ul>';inUL=false;} if(inOL){out+='</ol>';inOL=false;} }
    function closeBQ(){ if(inBQ){out+='</blockquote>';inBQ=false;} }

    function flushTable(){
      if(!inTable || tableRows.length === 0) return;
      out += '<table><thead><tr>';
      tableHeaders.forEach(function(h){
        out += '<th>' + inline(h) + '</th>';
      });
      out += '</tr></thead><tbody>';
      tableRows.forEach(function(row){
        out += '<tr>';
        row.forEach(function(cell){
          out += '<td>' + inline(cell) + '</td>';
        });
        out += '</tr>';
      });
      out += '</tbody></table>';
      inTable = false;
      tableRows = [];
      tableHeaders = [];
    }

    function parseTableRow(line){
      // Remove leading/trailing pipes
      var trimmed = line.trim();
      if(trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
      if(trimmed.charAt(trimmed.length-1) === '|') trimmed = trimmed.slice(0,-1);
      return trimmed.split('|').map(function(c){ return c.trim(); });
    }

    function isSeparator(line){
      return /^\|?[\s-:|]+\|?$/.test(line.trim()) && line.indexOf('-') >= 0;
    }

    for(var i=0;i<lines.length;i++){
      var line = lines[i];

      // Table detection
      if(line.indexOf('|') >= 0 && line.trim().charAt(0) !== '-'){
        var cells = parseTableRow(line);

        // Check if next line is a separator
        if(!inTable && i+1 < lines.length && isSeparator(lines[i+1])){
          inTable = true;
          tableHeaders = cells;
          i++; // skip separator line
          continue;
        }

        if(inTable){
          // Check if this line is still a table row
          if(line.trim().indexOf('|') >= 0){
            tableRows.push(cells);
            continue;
          } else {
            // End of table
            flushTable();
          }
        }
      } else if(inTable){
        flushTable();
      }

      if(/^### /.test(line)){ closeList();closeBQ(); out+='<h3>'+inline(line.slice(4))+'</h3>'; }
      else if(/^## /.test(line)){ closeList();closeBQ(); out+='<h2>'+inline(line.slice(3))+'</h2>'; }
      else if(/^# /.test(line)){ closeList();closeBQ(); out+='<h1>'+inline(line.slice(2))+'</h1>'; }
      else if(/^---+$/.test(line.trim())){ closeList();closeBQ(); out+='<hr>'; }
      else if(/^&gt; /.test(line)){ closeList(); if(!inBQ){out+='<blockquote>';inBQ=true;} out+='<p>'+inline(line.slice(5))+'</p>'; }
      else if(/^- /.test(line)){ closeBQ(); if(!inUL){closeList();out+='<ul>';inUL=true;} out+='<li>'+inline(line.slice(2))+'</li>'; }
      else if(/^\d+\. /.test(line)){ closeBQ(); if(!inOL){closeList();out+='<ol>';inOL=true;} out+='<li>'+inline(line.replace(/^\d+\. /,''))+'</li>'; }
      else if(line.trim()===''){ closeList();closeBQ(); }
      else { closeList();closeBQ(); out+='<p>'+inline(line)+'</p>'; }
    }
    closeList();closeBQ();flushTable();
    return out;
  }

  function renderReport(d){
    var mdEl = document.getElementById('md-' + d);
    if(!mdEl){ reportEl.innerHTML = '<div class="loading">报告不存在</div>'; return; }

    reportEl.classList.remove('show');

    setTimeout(function(){
      var md = mdEl.textContent.trim();
      var html = parseMarkdown(md);

      // Split into sections by ## headers for card layout
      var sections = splitSections(html);

      reportEl.innerHTML = sections.map(function(s){
        return '<div class="md-card"><div class="md">' + s + '</div></div>';
      }).join('');

      // Trigger animation - clear inline opacity first to let CSS class take effect
      reportEl.style.opacity = '';
      requestAnimationFrame(function(){
        reportEl.classList.add('show');
      });
    }, 200);
  }

  function splitSections(html){
    var parts = [];
    var h1Match = html.match(/<h1[^>]*>[\s\S]*?<\/h1>/);
    var h2Regex = /<h2[^>]*>[\s\S]*?(?=<h2|$)/g;
    var h2Matches = html.match(h2Regex) || [];

    if(h1Match){
      var afterH1 = html.slice(h1Match.index + h1Match[0].length);
      var firstH2 = afterH1.indexOf('<h2');
      var intro = firstH2 >= 0 ? afterH1.slice(0, firstH2) : afterH1;
      parts.push(h1Match[0] + intro);
    }

    h2Matches.forEach(function(m){ parts.push(m); });

    return parts.length ? parts : [html];
  }

  // Initial render
  renderReport(current);
})();
</script>

</body>
</html>
